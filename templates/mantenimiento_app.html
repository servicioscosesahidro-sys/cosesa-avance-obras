<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantenimiento · Plataforma COSESA</title></head><body>
<meta name="description" content="Sistema de mantenimiento y stock de repuestos — COSESA Servicios Industriales" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg: hsl(200 18% 97.3%);
  --surface: hsl(0 0% 100%);
  --surface-2: hsl(206 22% 94%);
  --surface-hover: hsl(206 26% 91%);
  --border: hsl(210 18% 87%);
  --border-soft: hsl(210 20% 92%);
  --ink: hsl(0 0% 16%);
  --ink-soft: hsl(210 8% 38%);
  --ink-faint: hsl(210 8% 56%);

  /* Brand blues sampled directly from the COSESA logo's radiating rays
     and "SERVICIOS INDUSTRIALES" wordmark (#0878c0 -> #18a8e0). */
  --brand-900: #0a2540;
  --brand-800: #0a4576;
  --brand-700: #075f9e;
  --brand-600: #0878c0;
  --brand-500: #1090d0;
  --brand-400: #1ba8e2;
  --brand-300: #6cc9ec;
  --brand-100: #dcf1fb;
  --brand-050: #f0faff;
  /* Charcoal sampled from the COSESA wordmark ink. */
  --brand-ink: #282828;
  --brand-gradient: linear-gradient(120deg, var(--brand-700) 0%, var(--brand-600) 45%, var(--brand-400) 100%);

  /* Accent gold sampled from cosesaservicios.com's CTA buttons and
     eyebrow highlights ("Ver servicios", "SERVICIOS INDUSTRIALES DESDE 1980"). */
  --accent: #f0c840;
  --accent-hover: #e0b62c;
  --accent-ink: #3a2d05;

  --ok: #1b8a51;
  --ok-bg: #e3f6ec;
  --ok-ink: #14683d;
  --warn: #b9740a;
  --warn-bg: #fbf0dc;
  --warn-ink: #8f5a08;
  --crit: #c8383f;
  --crit-bg: #fbe6e7;
  --crit-ink: #9c2b30;

  --shadow-sm: 0 1px 2px hsl(215 30% 20% / 0.06);
  --shadow-md: 0 4px 14px hsl(215 30% 20% / 0.08), 0 1px 3px hsl(215 30% 20% / 0.06);
  --shadow-lg: 0 16px 40px hsl(215 30% 15% / 0.16), 0 2px 8px hsl(215 30% 15% / 0.08);

  --sidebar-bg: #1f2023;
  --sidebar-bg-2: #292a2e;
  --sidebar-border: #38393e;
  --sidebar-ink: #dee1e4;
  --sidebar-ink-soft: #94989d;
  --sidebar-active: #0a5c93;

  --radius-sm: 7px;
  --radius-md: 11px;
  --radius-lg: 16px;

  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: hsl(215 26% 8%);
    --surface: hsl(215 24% 11.5%);
    --surface-2: hsl(215 22% 15%);
    --surface-hover: hsl(215 22% 19%);
    --border: hsl(215 18% 22%);
    --border-soft: hsl(215 18% 17%);
    --ink: hsl(210 25% 93%);
    --ink-soft: hsl(212 14% 68%);
    --ink-faint: hsl(212 10% 50%);

    --brand-100: #143246;
    --brand-050: #0f2634;

    --ok-bg: #123626;
    --ok-ink: #6ddba1;
    --warn-bg: #3a2c0e;
    --warn-ink: #e9b85c;
    --crit-bg: #3c1518;
    --crit-ink: #f18a8e;

    --shadow-sm: 0 1px 2px hsl(0 0% 0% / 0.3);
    --shadow-md: 0 4px 14px hsl(0 0% 0% / 0.35);
    --shadow-lg: 0 16px 40px hsl(0 0% 0% / 0.5);
  }
}
:root[data-theme="dark"]{
  --bg: hsl(215 26% 8%);
  --surface: hsl(215 24% 11.5%);
  --surface-2: hsl(215 22% 15%);
  --surface-hover: hsl(215 22% 19%);
  --border: hsl(215 18% 22%);
  --border-soft: hsl(215 18% 17%);
  --ink: hsl(210 25% 93%);
  --ink-soft: hsl(212 14% 68%);
  --ink-faint: hsl(212 10% 50%);

  --brand-100: #143246;
  --brand-050: #0f2634;

  --ok-bg: #123626;
  --ok-ink: #6ddba1;
  --warn-bg: #3a2c0e;
  --warn-ink: #e9b85c;
  --crit-bg: #3c1518;
  --crit-ink: #f18a8e;

  --shadow-sm: 0 1px 2px hsl(0 0% 0% / 0.3);
  --shadow-md: 0 4px 14px hsl(0 0% 0% / 0.35);
  --shadow-lg: 0 16px 40px hsl(0 0% 0% / 0.5);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; letter-spacing:0.2px; text-wrap:balance; }
p{ margin:0; }
button{ font-family:inherit; }
a{ color:inherit; }
::selection{ background:var(--brand-300); color:var(--brand-900); }
:focus-visible{ outline:2px solid var(--brand-500); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

/* ============ SHELL ============ */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:236px; flex:0 0 236px; background:var(--sidebar-bg);
  border-right:1px solid var(--sidebar-border);
  display:flex; flex-direction:column;
  position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:transform .22s ease;
}
.sidebar-brand{
  display:flex; flex-direction:column; gap:10px;
  padding:18px 18px 15px; border-bottom:1px solid var(--sidebar-border);
}
.brand-plate{
  background:#fdfefe; border-radius:10px; padding:10px 12px;
  box-shadow: 0 1px 0 hsl(0 0% 100% / .4) inset, var(--shadow-sm);
}
.brand-plate img{ display:block; width:100%; height:auto; }
.brand-text{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:0 1px; }
.brand-text .app{ font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--accent); letter-spacing:1.8px; text-transform:uppercase; }
.brand-text .ver{ font-family:var(--font-mono); font-size:10px; color:var(--sidebar-ink-soft); }

.sidebar-nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1; }
.nav-section-label{ font-size:10.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:var(--sidebar-ink-soft); padding:14px 10px 6px; }
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px;
  color:var(--sidebar-ink); text-decoration:none; font-size:14px; font-weight:500;
  cursor:pointer; border:none; background:transparent; width:100%; text-align:left;
  position:relative;
}
.nav-item svg{ width:17px; height:17px; flex:none; opacity:.85; }
.nav-item:hover{ background:var(--sidebar-bg-2); }
.nav-item.active{ background:var(--brand-gradient); color:#fff; box-shadow:0 2px 8px hsl(205 80% 30% / .35); }
.nav-item.active svg{ opacity:1; color:#fff; }
.nav-item .nav-badge{
  margin-left:auto; font-family:var(--font-mono); font-size:11px; font-weight:600;
  background:var(--crit); color:#fff; border-radius:999px; padding:1px 7px; min-width:18px; text-align:center;
}
.nav-item .nav-badge.warn{ background:var(--warn); }

.sidebar-foot{
  padding:14px; border-top:1px solid var(--sidebar-border);
  display:flex; align-items:center; gap:10px;
}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--brand-600); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;
}
.sidebar-foot .who{ display:flex; flex-direction:column; line-height:1.3; min-width:0; flex:1; }
.sidebar-foot .who b{ font-size:13px; color:#fff; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-foot .who .role-pill{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; margin-top:2px; }
.sidebar-foot .who .role-pill.admin{ color:var(--brand-300); }
.sidebar-foot .who .role-pill.usuario{ color:var(--sidebar-ink-soft); }
.sidebar-foot .logout-btn{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--sidebar-border); background:transparent;
  color:var(--sidebar-ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.sidebar-foot .logout-btn:hover{ background:var(--sidebar-bg-2); color:#fff; }
.sidebar-foot .logout-btn svg{ width:15px; height:15px; }

.main-col{ flex:1; margin-left:236px; display:flex; flex-direction:column; min-height:100vh; min-width:0; }

/* ============ LOGIN SCREEN ============ */
.login-wrap{
  position:fixed; inset:0; z-index:500; background:
    radial-gradient(1100px 700px at 15% -10%, var(--brand-800) 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, var(--brand-700) 0%, transparent 55%),
    var(--sidebar-bg);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{ width:100%; max-width:392px; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); overflow:hidden; border:1px solid var(--border-soft); }
.login-card::before{ content:""; display:block; height:5px; background:var(--brand-gradient); }
.login-brand{ background:#fdfefe; padding:22px 28px 18px; display:flex; justify-content:center; }
.login-brand img{ width:190px; height:auto; display:block; }
.login-body{ padding:26px 28px 28px; }
.login-body h2{ font-size:21px; margin-bottom:4px; }
.login-body .sub{ font-size:13px; color:var(--ink-faint); margin-bottom:20px; }
.login-error{ display:flex; align-items:center; gap:8px; background:var(--crit-bg); color:var(--crit-ink); border-radius:9px; padding:9px 12px; font-size:12.5px; font-weight:600; margin-bottom:16px; }
.login-error svg{ width:15px; height:15px; flex:none; }
.login-demo{ margin-top:20px; border-top:1px solid var(--border-soft); padding-top:16px; }
.login-demo .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); margin-bottom:9px; }
.demo-user{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:8px; background:var(--surface-2); margin-bottom:6px; cursor:pointer; border:1px solid transparent; }
.demo-user:hover{ border-color:var(--brand-400); }
.demo-user .nm{ font-size:12.5px; font-weight:600; }
.demo-user .cred{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }

.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; gap:14px; padding:14px 26px;
}
.menu-btn{ display:none; }
.topbar-titles{ min-width:0; }
.topbar-titles .crumb{ font-size:12px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
.topbar-titles h1{ font-size:25px; line-height:1.15; }
.topbar-spacer{ flex:1; }
.topbar-search{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:8px 12px; width:250px; color:var(--ink-faint);
}
.topbar-search svg{ width:15px; height:15px; flex:none; }
.topbar-search input{ border:none; background:transparent; outline:none; color:var(--ink); font-size:13.5px; width:100%; }
.search-results{
  position:absolute; top:calc(100% + 8px); left:0; width:340px; max-height:360px; overflow-y:auto;
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); z-index:60; padding:6px;
}
.sr-group{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); padding:8px 8px 4px; }
.sr-item{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; cursor:pointer; }
.sr-item:hover, .sr-item.active{ background:var(--surface-2); }
.sr-item .sr-ic{ width:28px; height:28px; border-radius:7px; background:var(--brand-050); color:var(--brand-600); display:flex; align-items:center; justify-content:center; flex:none; }
.sr-item .sr-ic svg{ width:14px; height:14px; }
.sr-item .sr-tx{ min-width:0; flex:1; }
.sr-item .sr-tx .n{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-item .sr-tx .s{ font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-empty{ padding:14px 10px; font-size:12.5px; color:var(--ink-faint); text-align:center; }
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); position:relative; flex:none;
}
.icon-btn svg{ width:17px; height:17px; }
.icon-btn:hover{ background:var(--surface-hover); color:var(--ink); }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--crit); border:2px solid var(--bg); }

.main{ flex:1; padding:22px 26px 60px; max-width:1360px; width:100%; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:9px; font-weight:600; font-size:13.5px;
  padding:9px 15px; border:1px solid transparent; cursor:pointer; white-space:nowrap; line-height:1.2;
}
.btn svg{ width:15px; height:15px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-sm); font-weight:700; }
.btn-primary:hover{ background:var(--accent-hover); }
.btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
.btn-secondary:hover{ background:var(--surface-hover); }
.btn-ghost{ background:transparent; color:var(--ink-soft); }
.btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
.btn-danger{ background:var(--crit); color:#fff; }
.btn-danger:hover{ filter:brightness(1.08); }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-block{ width:100%; justify-content:center; }

/* ============ SURFACES ============ */
.card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
.card-pad{ padding:20px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
.section-head h2{ font-size:19px; }
.section-head .hint{ font-size:12.5px; color:var(--ink-faint); }

.kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
.kpi{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:17px 18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px; }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; }
.kpi-label{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; }
.kpi-ic{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
.kpi-ic svg{ width:15px; height:15px; }
.kpi-value{ font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1; }
.kpi-sub{ font-size:12px; color:var(--ink-faint); }

.pill{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px 3px 8px; border-radius:999px; letter-spacing:0.2px; white-space:nowrap; }
.pill svg{ width:11px; height:11px; }
.pill-ok{ background:var(--ok-bg); color:var(--ok-ink); }
.pill-warn{ background:var(--warn-bg); color:var(--warn-ink); }
.pill-crit{ background:var(--crit-bg); color:var(--crit-ink); }
.pill-neutral{ background:var(--surface-2); color:var(--ink-soft); }
.pill-brand{ background:var(--brand-100); color:var(--brand-700); }
:root[data-theme="dark"] .pill-brand, @media (prefers-color-scheme:dark){ .pill-brand{ color:var(--brand-300); } }

.progress{ height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.progress > i{ display:block; height:100%; border-radius:99px; }

/* ============ TABLES ============ */
.table-wrap{ overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border-soft); background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
thead th{
  text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  color:var(--ink-faint); padding:11px 14px; border-bottom:1px solid var(--border-soft); background:var(--surface-2);
  white-space:nowrap; position:sticky; top:0;
}
tbody td{ padding:11px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--surface-2); }
.row-link{ cursor:pointer; }
.cell-strong{ font-weight:600; }
.cell-muted{ color:var(--ink-faint); }
.td-num{ text-align:right; font-family:var(--font-mono); }

/* ============ FORMS ============ */
label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
.field{ margin-bottom:16px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--ink);
  border-radius:9px; padding:9px 12px; font-size:14px; font-family:inherit; outline:none;
}
input:focus, select:focus, textarea:focus{ border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100); }
textarea{ resize:vertical; min-height:70px; }
.help{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; }

/* ============ MISC ============ */
.badge-type{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-soft); }
.badge-type svg{ width:13px; height:13px; }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(272px,1fr)); gap:14px; }
.mach-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:16px 17px; box-shadow:var(--shadow-sm); cursor:pointer; display:flex; flex-direction:column; gap:10px; }
.mach-card:hover{ border-color:var(--brand-400); box-shadow:var(--shadow-md); transform:translateY(-1px); transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
.mach-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.mach-ic{ width:38px; height:38px; border-radius:10px; background:var(--brand-050); color:var(--brand-600); display:flex; align-items:center; justify-content:center; flex:none; }
.mach-ic svg{ width:19px; height:19px; }
.mach-card h3{ font-size:19px; }
.mach-meta{ font-size:12px; color:var(--ink-faint); }
.mach-meter{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border-soft); margin-bottom:18px; }
.tab-btn{ padding:10px 15px; font-size:13.5px; font-weight:600; color:var(--ink-faint); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab-btn:hover{ color:var(--ink); }
.tab-btn.active{ color:var(--brand-600); border-bottom-color:var(--brand-600); }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
.empty svg{ width:34px; height:34px; margin-bottom:10px; opacity:.6; }
.empty p{ font-size:13.5px; }

.chip{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--ink-soft); font-size:12px; padding:4px 9px; border-radius:8px; font-family:var(--font-mono); }
.chip b{ font-family:var(--font-body); color:var(--ink); }

.banner{ display:flex; gap:12px; align-items:flex-start; padding:13px 16px; border-radius:var(--radius-md); margin-bottom:18px; font-size:13px; border:1px solid; }
.banner svg{ width:17px; height:17px; flex:none; margin-top:1px; }
.banner-info{ background:var(--brand-050); border-color:var(--brand-100); color:var(--brand-700); }
:root[data-theme=dark] .banner-info, @media(prefers-color-scheme:dark){ .banner-info{ color:var(--brand-300); } }
.banner-warn{ background:var(--warn-bg); border-color:var(--warn-bg); color:var(--warn-ink); }
.banner-crit{ background:var(--crit-bg); border-color:var(--crit-bg); color:var(--crit-ink); }

.back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:10px; }
.back-link svg{ width:14px; height:14px; }
.back-link:hover{ color:var(--brand-600); }

/* Wizard parts list */
.parts-check{ display:flex; flex-direction:column; gap:8px; }
.part-row{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--border-soft); border-radius:10px; background:var(--surface-2); }
.part-row .pi{ flex:1; min-width:0; }
.part-row .pi .nm{ font-weight:600; font-size:13.5px; }
.part-row .pi .cd{ font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); }
.part-row .qty{ font-family:var(--font-mono); font-weight:700; font-size:13.5px; white-space:nowrap; }
.part-row.short{ border-color:var(--crit); background:var(--crit-bg); }

/* Task editor: parts picker checklist */
.parts-picker{ max-height:280px; overflow-y:auto; border:1px solid var(--border-soft); border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:2px; background:var(--surface); }
.part-pick-row{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:7px; cursor:pointer; }
.part-pick-row:hover{ background:var(--surface-2); }
.part-pick-row input[type=checkbox]{ width:16px; height:16px; flex:none; accent-color:var(--brand-600); }
.part-pick-row .ppr-name{ flex:1; min-width:0; font-size:13px; }
.part-pick-row .ppr-code{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
.part-pick-row .ppr-qty{ width:56px; padding:5px 7px; font-size:12.5px; text-align:center; flex:none; }

/* Modal */
.modal-back{ position:fixed; inset:0; background:hsl(215 30% 8% / .55); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--surface); border-radius:var(--radius-lg); max-width:460px; width:100%; box-shadow:var(--shadow-lg); border:1px solid var(--border-soft); overflow:hidden; }
.modal-body{ padding:22px; }
.modal-body h3{ font-size:19px; margin-bottom:8px; }
.modal-body p{ font-size:13.5px; color:var(--ink-soft); margin-bottom:18px; line-height:1.5; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; padding:14px 22px; background:var(--surface-2); border-top:1px solid var(--border-soft); }

/* Toasts */
#toasts{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{ display:flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); max-width:340px; animation:toastIn .18s ease; }
.toast svg{ width:16px; height:16px; flex:none; }
.toast.ok svg{ color:#7be3a8; }
.toast.err svg{ color:#f18a8e; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* Plataforma */
.plat-link{ display:inline-flex; align-items:center; gap:6px; color:var(--sidebar-ink-soft); font-size:12px; font-weight:600; text-decoration:none; padding:2px 1px; }
.plat-link:hover{ color:#fff; }
.plat-link svg{ width:13px; height:13px; }
.sync-badge{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 11px; white-space:nowrap; }
.sync-badge .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); }
.sync-badge.saving .dot{ background:var(--warn); }
.sync-badge.error .dot{ background:var(--crit); }
@media (max-width: 980px){ .orden-grid{ grid-template-columns:1fr !important; } .sync-badge .txt{ display:none; } }

/* Sidebar overlay for mobile */
.sidebar-overlay{ display:none; position:fixed; inset:0; background:hsl(215 30% 6% / .5); z-index:39; }

@media (max-width: 980px){
  .kpi-grid{ grid-template-columns:repeat(2,1fr); }
  .field-row{ grid-template-columns:1fr; }
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); box-shadow:var(--shadow-lg); }
  .sidebar.open ~ .sidebar-overlay{ display:block; }
  .main-col{ margin-left:0; }
  .menu-btn{ display:flex; }
  .topbar-search{ display:none; }
}
@media (max-width: 620px){
  .kpi-grid{ grid-template-columns:1fr 1fr; }
  .main{ padding:16px 14px 50px; }
  .topbar{ padding:12px 14px; }
  .topbar-titles h1{ font-size:21px; }
}
</style>

/* ================= UTIL ================= */
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function fmtInt(n){ return Math.round(n).toLocaleString("es-AR"); }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-AR", {day:"2-digit", month:"short", year:"numeric"});
}
function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function buildInitialState(){
  /* Arranque limpio con los equipos, planes y repuestos del Excel.
     Los medidores arrancan sin lectura: se cargan con "Importar horas". */
  var machines = MACHINES_SEED.map(function(m){
    var tasks = m.tasks.map(function(t){ return Object.assign({}, t, { lastMeter: null, lastDate: null }); });
    return Object.assign({}, m, { currentMeter: 0, tasks: tasks, notes: "" });
  });
  var parts = PARTS_SEED.map(function(p){ return Object.assign({}, p); });
  return { machines: machines, parts: parts, movements: [], maintenances: [], ordenSeq: 0,
    alertSettings: { enabled: false, emails: ["taller@cosesaservicios.com"] }, alertLog: [], seededAt: Date.now() };
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function normalizeState(st){
  st = st || buildInitialState();
  ["machines","parts","movements","maintenances","alertLog"].forEach(function(k){ if(!Array.isArray(st[k])) st[k] = []; });
  if(!st.alertSettings) st.alertSettings = { enabled:false, emails:["taller@cosesaservicios.com"] };
  if(typeof st.ordenSeq !== "number") st.ordenSeq = 0;
  delete st.users;
  st.machines.forEach(function(m){ ensureMeters(m); (m.tasks||[]).forEach(function(t){ if(!t.unidad) t.unidad = m.meterType; if(!Array.isArray(t.parts)) t.parts = []; }); });
  var semU = sembrarUnidadesEasytrack(st);
  var semP = sembrarPlanesTipo(st);
  st.__sembrado = semU || semP;
  return st;
}
function apiJSON(method, url, body){
  return fetch(url, { method: method, credentials:"same-origin",
      headers: body ? { "Content-Type":"application/json", "Accept":"application/json" } : { "Accept":"application/json" },
      body: body ? JSON.stringify(body) : undefined })
    .then(function(r){
      if(r.redirected && /\/login/.test(r.url)){ location.href = r.url; return { status:401, d:{ ok:false } }; }
      return r.json().then(function(d){ return { status:r.status, d:d }; }, function(){ return { status:r.status, d:{ ok:false, error:"Error del servidor ("+r.status+")" } }; });
    })
    .catch(function(){ return { status:0, d:{ ok:false, error:"Sin conexión con el servidor" } }; });
}
/* Guarda todo el estado en el servidor. Cada guardado lleva la versión que
   tenía esta pantalla: si otro usuario guardó antes, el servidor lo rechaza
   (409), se recarga lo último y se avisa, así nunca se pisa el stock. */
function saveState(){
  var gen = saveGen;
  var payload = JSON.stringify(state);
  pendingSaves++;
  setSync("saving", "Guardando…");
  saveChain = saveChain.then(function(){
    if(gen !== saveGen){ pendingSaves--; return false; }
    return apiJSON("POST", API+"/estado", { version: serverVersion, doc: JSON.parse(payload) }).then(function(res){
      pendingSaves--;
      if(res.d.ok){
        serverVersion = res.d.version;
        if(pendingSaves<=0){ pendingSaves = 0; setSync("", "Guardado"); }
        return true;
      }
      if(res.status===409){
        saveGen++; pendingSaves = 0;
        serverVersion = res.d.version;
        state = normalizeState(res.d.doc); delete state.__sembrado;
        setSync("", "Guardado");
        closeModal();
        showModal('<div class="modal-body"><h3>Otro usuario hizo cambios</h3><p><b>'+escapeHtml(res.d.actualizado_por||"Otro usuario")+'</b> guardó cambios mientras trabajabas. Se cargó la versión más nueva y <b>tu último cambio no se guardó</b>: revisalo y volvé a hacerlo.</p></div><div class="modal-actions"><button class="btn btn-primary" id="mCancel">Entendido</button></div>');
        document.getElementById("mCancel").onclick = closeModal;
        render();
        return false;
      }
      setSync("error", "No se guardó");
      toast(res.d.error || "No se pudo guardar", "err");
      return false;
    });
  });
  return saveChain;
}
function loadState(){
  return apiJSON("GET", API+"/estado").then(function(res){
    if(!res.d.ok) throw new Error(res.d.error || "No se pudieron cargar los datos");
    PLATFORM.usuario = res.d.usuario; PLATFORM.urls = res.d.urls || {};
    serverVersion = res.d.version;
    state = normalizeState(res.d.doc);
    var sembrado = state.__sembrado; delete state.__sembrado;
    if(!res.d.doc || sembrado){ return saveState(); }
  });
}
function refrescarDesdeServidor(){
  if(pendingSaves>0 || document.getElementById("modalRoot").innerHTML.trim()!=="") return;
  var ae = document.activeElement;
  if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && route.view!=="solicitudes") return;
  apiJSON("GET", API+"/estado").then(function(res){
    if(!res.d.ok || pendingSaves>0) return;
    var cambio = res.d.version !== serverVersion;
    if(cambio){ serverVersion = res.d.version; state = normalizeState(res.d.doc); delete state.__sembrado; }
    cargarSolicitudes().then(function(){ if(route.view!=="generar" && route.view!=="orden") render(); });
  });
}

/* ================= LOOKUPS ================= */
function getMachine(id){ return state.machines.find(function(m){ return m.id===id; }); }
function getPart(id){ return state.parts.find(function(p){ return p.id===id; }); }
function getTask(machine, taskId){ return machine.tasks.find(function(t){ return t.id===taskId; }); }

function partStatus(p){
  if(p.stock<=0) return "crit";
  if(p.stock<p.min) return "warn";
  return "ok";
}
function taskProgress(t, mOrMeter){
  var uT = (mOrMeter && typeof mOrMeter==="object") ? tUnit(t, mOrMeter) : t.unidad;
  if(esTiempo(uT)) return progresoTiempo(t, uT);
  var currentMeter = (mOrMeter && typeof mOrMeter==="object") ? meterOf(mOrMeter, tUnit(t, mOrMeter)) : mOrMeter;
  if(t.lastMeter==null) return { pct: 0, status: "nodata", remaining: null, used: null };
  var used = currentMeter - t.lastMeter;
  var pct = clamp(used / t.intervalo, 0, 1.4);
  var status = pct>=1 ? "crit" : (pct>=0.85 ? "warn" : "ok");
  var remaining = t.intervalo - used;
  return { pct: Math.min(pct,1), status: status, remaining: remaining, used: used };
}
function machineOverallStatus(m){
  var worst = "ok";
  m.tasks.forEach(function(t){
    var s = taskProgress(t, m).status;
    if(s==="crit") worst="crit"; else if(s==="warn" && worst!=="crit") worst="warn";
    else if(s==="nodata" && worst==="ok") worst="nodata";
  });
  return worst;
}
function statusMeta(s){
  if(s==="nodata") return { label:"Sin datos", cls:"pill-neutral", icon:"i-gauge", bar:"var(--border)" };
  if(s==="crit") return { label:"Vencido", cls:"pill-crit", icon:"i-alert-circle", bar:"var(--crit)" };
  if(s==="warn") return { label:"Próximo", cls:"pill-warn", icon:"i-alert", bar:"var(--warn)" };
  return { label:"Al día", cls:"pill-ok", icon:"i-check-circle", bar:"var(--ok)" };
}
function stockMeta(s){
  if(s==="crit") return { label:"Sin stock", cls:"pill-crit" };
  if(s==="warn") return { label:"Stock bajo", cls:"pill-warn" };
  return { label:"OK", cls:"pill-ok" };
}

function counts(){
  var vencidos=0, proximos=0, critStock=0, warnStock=0;
  state.machines.forEach(function(m){
    m.tasks.forEach(function(t){
      var s = taskProgress(t, m).status;
      if(s==="crit") vencidos++; else if(s==="warn") proximos++;
    });
  });
  state.parts.forEach(function(p){
    var s = partStatus(p);
    if(s==="crit") critStock++; else if(s==="warn") warnStock++;
  });
  var solPend = SOLICITUDES.filter(function(x){ return x.estado==="pendiente" && ordenesDeSolicitud(x.id).length===0; }).length;
  return { vencidos:vencidos, proximos:proximos, critStock:critStock, warnStock:warnStock, solPend:solPend };
}

/* ================= STOCK MOVEMENTS ================= */
function applyMovement(partId, delta, tipo, ref){
  var p = getPart(partId);
  if(!p) return;
  var before = p.stock;
  p.stock = Math.max(0, p.stock + delta);
  var u = currentUser();
  state.movements.unshift({
    id: uid("MV"), partId: partId, delta: p.stock-before, tipo: tipo, ref: ref||"",
    fecha: todayISO(), stockResultante: p.stock, cargadoPor: u ? u.nombre : "—"
  });
}

/* ================= ROUTER ================= */
var route = { view:"dashboard", params:{} };
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  return { view: parts[0] || "dashboard", params: { id: parts[1] ? decodeURIComponent(parts[1]) : null, sub: parts[2] || null } };
}
function navigate(view, params){
  var p = params && params.id ? "/"+encodeURIComponent(params.id) : "";
  location.hash = "#/"+view+p;
}
window.addEventListener("hashchange", function(){ route = parseHash(); if(currentUser() && state) render(); closeSidebar(); });

function renderSidebarNav(){
  var c = counts();
  var admin = isAdmin();
  var out = NAV.filter(function(item){ return !item.adminOnly || admin; }).map(function(item){
    if(item.section) return '<div class="nav-section-label">'+escapeHtml(item.section)+'</div>';
    var active = route.view===item.view ? " active":"";
    var badge = "";
    if(item.badgeKey && c[item.badgeKey]>0){ badge = '<span class="nav-badge'+(item.badgeKey==="solPend"?" warn":"")+'">'+c[item.badgeKey]+'</span>'; }
    if(item.view==="planes" && c.vencidos>0){ badge = '<span class="nav-badge">'+c.vencidos+'</span>'; }
    return '<button class="nav-item'+active+'" data-nav="'+item.view+'"><svg><use href="#'+item.icon+'"/></svg>'+item.label+badge+'</button>';
  }).join("");
  document.getElementById("sidebarNav").innerHTML = out;

  var u = currentUser();
  if(u){
    document.getElementById("sidebarFoot").innerHTML =
      '<div class="avatar">'+initials(u.nombre)+'</div>'+
      '<div class="who"><b title="'+escapeHtml(u.nombre)+'">'+escapeHtml(u.nombre)+'</b><span class="role-pill '+u.rol+'"><svg style="width:10px;height:10px;"><use href="#'+(u.rol==="admin"?"i-check-circle":"i-user")+'"/></svg>'+ROLE_LABEL[u.rol]+'</span></div>'+
      '<button class="logout-btn" id="logoutBtn" title="Cerrar sesión de la plataforma"><svg><use href="#i-arrow-left"/></svg></button>';
    var lb = document.getElementById("logoutBtn");
    if(lb) lb.onclick = doLogout;
  }
}
function initials(name){
  var parts = (name||"").trim().split(/\s+/);
  return ((parts[0]||"")[0]||"").toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase();
}

/* ================= TOASTS ================= */
function toast(msg, kind){
  var el = document.createElement("div");
  el.className = "toast "+(kind||"ok");
  el.innerHTML = '<svg><use href="#'+(kind==="err"?"i-x":"i-check")+'"/></svg><span></span>';
  el.querySelector("span").textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function(){ el.style.transition="opacity .25s ease"; el.style.opacity="0"; setTimeout(function(){ el.remove(); }, 260); }, 2600);
}

/* ================= MODAL ================= */
function showModal(html){
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="modal-back" id="modalBack"><div class="modal">'+html+'</div></div>';
  document.getElementById("modalBack").addEventListener("click", function(e){ if(e.target.id==="modalBack") closeModal(); });
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && document.getElementById("modalRoot").innerHTML.trim()!==""){ closeModal(); }
});

function confirmModal(opts){
  showModal(
    '<div class="modal-body">'+
      '<h3>'+escapeHtml(opts.title)+'</h3>'+
      '<p>'+opts.body+'</p>'+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-secondary" id="mCancel">Cancelar</button>'+
      '<button class="btn '+(opts.danger?"btn-danger":"btn-primary")+'" id="mConfirm">'+escapeHtml(opts.confirmLabel||"Confirmar")+'</button>'+
    '</div>'
  );
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mConfirm").onclick = function(){ closeModal(); opts.onConfirm(); };
}

  }

    kpiCard("i-truck","Flota total", state.machines.length, (state.machines.filter(function(m){return m.tipo==="motobomba";}).length)+" motobombas · "+(state.machines.filter(function(m){return m.tipo==="vehiculo";}).length)+" vehículos", "brand")+
    kpiCard("i-alert-circle","Mantenimientos vencidos", c.vencidos, "requieren atención inmediata", "crit")+
    kpiCard("i-alert","Próximos a vencer", c.proximos, "dentro del 15% del intervalo", "warn")+
    kpiCard("i-box","Repuestos en alerta", c.critStock+c.warnStock, c.critStock+" sin stock · "+c.warnStock+" bajo mínimo", "crit")+
  '</div>';

  html += '<div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;">';

  html += '<div class="card card-pad">'+
    '<div class="section-head"><h2>Próximos mantenimientos</h2><span class="hint">'+soonList.length+' pendientes de atención</span></div>';
  if(soonList.length===0){
    html += emptyState("i-check-circle", state.machines.some(function(m){ return machineOverallStatus(m)==="nodata"; }) ? "No hay vencidos ni próximos entre las unidades con datos. Faltan cargar medidores en algunas unidades." : "Toda la flota está al día. ¡Buen trabajo!");
  } else {
    html += '<div style="display:flex; flex-direction:column; gap:10px;">';
    soonList.slice(0,6).forEach(function(row){
      var meta = statusMeta(row.pr.status);
      html += '<div class="row-link" data-nav="flota" data-id="'+row.m.id+'" style="display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--border-soft); border-radius:10px;">'+
        '<div class="mach-ic" style="width:32px;height:32px;"><svg><use href="#'+machineIcon(row.m.tipo)+'"/></svg></div>'+
        '<div style="flex:1; min-width:0;"><div class="cell-strong">'+escapeHtml(row.m.nombre)+'</div><div class="cell-muted" style="font-size:12px;">'+escapeHtml(row.t.nombre)+' · '+(row.pr.remaining===0 && esTiempo(tUnit(row.t,row.m)) ? 'vence hoy' : row.pr.remaining>0 ? 'vence en '+fmtCant(row.pr.remaining, tUnit(row.t,row.m)) : 'vencido hace '+fmtCant(-row.pr.remaining, tUnit(row.t,row.m)))+'</div></div>'+

function kpiCard(icon, label, value, sub, tone){
  var toneBg = tone==="crit" ? "var(--crit-bg)" : tone==="warn" ? "var(--warn-bg)" : "var(--brand-100)";
  var toneInk = tone==="crit" ? "var(--crit-ink)" : tone==="warn" ? "var(--warn-ink)" : "var(--brand-700)";
  return '<div class="kpi"><div class="kpi-top"><span class="kpi-label">'+escapeHtml(label)+'</span><div class="kpi-ic" style="background:'+toneBg+'; color:'+toneInk+';"><svg><use href="#'+icon+'"/></svg></div></div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+escapeHtml(sub)+'</div></div>';
}
function emptyState(icon, msg){
  return '<div class="empty"><svg><use href="#'+icon+'"/></svg><p>'+escapeHtml(msg)+'</p></div>';
}

  if(list.length===0) return '<div class="table-wrap">'+emptyState("i-history","Todavía no hay mantenimientos generados.")+'</div>';
  var rows = list.map(function(rec){
    var m = getMachine(rec.machineId);
    var partsChips = rec.partesUsadas.map(function(pu){
      var p = getPart(pu.partId);
      return '<span class="chip"><b>'+pu.qty+'×</b>'+escapeHtml(p?p.nombre:pu.partId)+'</span>';
    }).join(" ");
    var nombreUnidad = m ? m.nombre : (rec.equipoTexto || "Equipo de planta");
    var origen = rec.solicitud ? '<div class="cell-muted" style="font-size:11.5px;">Obra: '+escapeHtml(rec.solicitud.obra)+' · '+escapeHtml(rec.solicitud.cliente)+'</div>' : '';
    var estadoPill = rec.estado==="anulado" ? '<span class="pill pill-neutral"><svg><use href="#i-ban"/></svg>Anulado</span>' :
      (rec.faltante ? '<span class="pill pill-warn"><svg><use href="#i-alert"/></svg>Con faltante</span>' : '<span class="pill pill-ok"><svg><use href="#i-check-circle"/></svg>Completado</span>');
    return '<tr>'+
      '<td class="cell-muted mono" style="white-space:nowrap;">'+fmtDate(rec.fecha)+(rec.numero?'<div style="font-size:11px; font-weight:700; color:var(--ink-soft);">'+escapeHtml(rec.numero)+'</div>':'')+'</td>'+
      (m ? '<td class="cell-strong row-link" data-nav="flota" data-id="'+rec.machineId+'">'+escapeHtml(nombreUnidad)+origen+'</td>' : '<td class="cell-strong">'+escapeHtml(nombreUnidad)+origen+'</td>')+
      '<td>'+escapeHtml(rec.taskNombre)+(rec.trabajo?'<div class="cell-muted" style="font-size:11.5px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="'+escapeHtml(rec.trabajo)+'">'+escapeHtml(rec.trabajo)+'</div>':'')+'</td>'+
      '<td class="mono">'+(rec.medidor!=null ? fmtInt(rec.medidor)+' '+(m?UNIT_LABEL[rec.medidorUnidad||m.meterType]:"") : "—")+'</td>'+
      '<td>'+escapeHtml(rec.tecnico||"—")+'</td>'+
      '<td style="max-width:260px;"><div style="display:flex; flex-wrap:wrap; gap:5px;">'+partsChips+'</div></td>'+
      '<td>'+estadoPill+'</td>'+
      '<td class="cell-muted" style="font-size:12px;">'+escapeHtml(rec.cargadoPor||"—")+'</td>'+
      '<td><div style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">'+
        '<button class="btn btn-ghost btn-sm" data-action="print-maint" data-id="'+rec.id+'" title="Imprimir orden de mantenimiento"><svg><use href="#i-print"/></svg></button>'+
        (rec.estado!=="anulado" && isAdmin() ? '<button class="btn btn-ghost btn-sm" data-action="edit-consumables" data-id="'+rec.id+'" title="Editar consumibles"><svg><use href="#i-box"/></svg></button>' : '')+
        (rec.estado!=="anulado" && isAdmin() ? '<button class="btn btn-ghost btn-sm" data-action="void-maint" data-id="'+rec.id+'"><svg><use href="#i-ban"/></svg>Anular</button>' : '')+
      '</div></td>'+
    '</tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>Fecha / N°</th><th>Unidad / equipo</th><th>Tarea / trabajo</th><th>Medidor</th><th>Técnico</th><th>Repuestos consumidos</th><th>Estado</th><th>Cargado por</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function viewFlota(){
  setHeader("Máquinas y vehículos");
  var q = (window.__flotaQuery||"").toLowerCase();
  var tipoFilter = window.__flotaTipo||"todos";
  var groups = [
    { key:"motobomba", label:"Motobombas" },
    { key:"vehiculo", label:"Vehículos" }
  ];
  var html = '<div id="etEstado"></div><div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:16px;">'+
    '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">'+
      '<div class="topbar-search" style="width:260px;"><svg><use href="#i-search"/></svg><input type="search" id="flotaSearch" placeholder="Buscar máquina o vehículo…" value="'+escapeHtml(window.__flotaQuery||"")+'"></div>'+
      '<div class="tabs" style="border-bottom:none; margin-bottom:0;">'+
        [["todos","Todos"],["motobomba","Motobombas"],["vehiculo","Vehículos"]].map(function(kv){
          return '<button class="tab-btn'+(tipoFilter===kv[0]?" active":"")+'" data-action="flota-filter" data-key="'+kv[0]+'">'+kv[1]+'</button>';
        }).join("")+
      '</div>'+
    '</div>'+
    (isAdmin() ? '<div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" data-action="import-easytrack"><svg><use href="#i-upload"/></svg>Importar Easytrack</button><button class="btn btn-secondary btn-sm" data-action="import-meters"><svg><use href="#i-gauge"/></svg>Cargar medidores</button><button class="btn btn-primary btn-sm" data-action="machine-new"><svg><use href="#i-plus"/></svg>Nueva máquina</button></div>' : '')+
  '</div>';

  var any = false;
  groups.forEach(function(g){
    if(tipoFilter!=="todos" && tipoFilter!==g.key) return;
    var list = state.machines.filter(function(m){
      if(m.tipo!==g.key) return false;
      if(!q) return true;
      return (m.nombre+" "+(m.motor||"")+" "+(m.serie||"")+" "+(m.patente||"")).toLowerCase().indexOf(q)>=0;

function saveAlertSettings(){
  if(!isAdmin()){ toast("Solo un administrador puede configurar las alertas", "err"); return; }
  var enabled = document.getElementById("alEnabled").checked;
  var emails = document.getElementById("alEmails").value.split(",").map(function(e){ return e.trim(); }).filter(Boolean);
  state.alertSettings = { enabled: enabled, emails: emails };
  saveState();
  toast("Configuración de alertas guardada");
  render();
}
function simulateAlertSend(){
  if(!isAdmin()){ toast("Solo un administrador puede simular el envío", "err"); return; }
  var vencidos=0, critStock=0;
  state.machines.forEach(function(m){ m.tasks.forEach(function(t){ if(taskProgress(t, m).status==="crit") vencidos++; }); });
  state.parts.forEach(function(p){ if(partStatus(p)==="crit") critStock++; });
  var total = vencidos + critStock;
  if(total===0){ toast("No hay alertas pendientes para enviar", "err"); return; }
  var emails = state.alertSettings.emails;
  if(!emails.length){ toast("Cargá al menos un destinatario antes de simular el envío", "err"); return; }
  var u = currentUser();
  state.alertLog.unshift({ fecha: todayISO(), emails: emails.join(", "), total: total, por: u?u.nombre:"—" });
  saveState();
  toast("Alerta simulada: se \"enviaría\" un email a "+emails.length+" destinatario(s) con "+total+" ítem(s)");
  render();
}


/* ================= EXPORTAR CSV ================= */
function csvCell(v){
  v = v==null ? "" : String(v);
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCSV(headers, rows){
  var lines = [headers.map(csvCell).join(",")];
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(",")); });
  return "﻿" + lines.join("\r\n");
}
/* Descarga de archivos: dentro de Claude usa la capability "downloads";
   abierto como archivo local usa Blob + <a download>. */
var _downloadsPromise = null;
function getDownloads(){
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  if(!_downloadsPromise){
    _downloadsPromise = window.claude.use("downloads").catch(function(){ return null; });
  }
  return _downloadsPromise;
}
function browserDownload(filename, data, mime){
  try{
    var blob = new Blob([data], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(e){ return false; }
}
/* opts: { filename, data, mime, okMsg, altExt } -> Promise<boolean> */
function saveFile(opts){
  return getDownloads().then(function(downloads){
    if(!downloads){
      if(window.claude && window.claude.use){
        toast("La descarga de archivos no está disponible en esta vista", "err"); return false;
      }
      var ok = browserDownload(opts.filename, opts.data, opts.mime);
      toast(ok ? (opts.okMsg || ("Descargado "+opts.filename)) : "No se pudo descargar el archivo", ok ? undefined : "err");
      return ok;
    }
    return downloads.save({ filename: opts.filename, data: opts.data }).then(function(){
      toast(opts.okMsg || ("Descargado "+opts.filename)); return true;
    }).catch(function(err){
      var code = err && err.code;
      if(code==="declined") return false;
      if(code==="extension_not_enabled" && opts.altExt){
        var alt = opts.filename.replace(/\.[^.]+$/, "") + "." + opts.altExt;
        return downloads.save({ filename: alt, data: opts.data }).then(function(){
          toast("Se descargó como "+alt); return true;
        }).catch(function(){ toast("No se pudo descargar el archivo", "err"); return false; });
      }
      toast("No se pudo descargar el archivo", "err"); return false;
    });
  });
}
function downloadCSV(filenameBase, headers, rows){
  if(!rows.length){ toast("No hay datos para exportar", "err"); return; }
  saveFile({ filename: filenameBase+".csv", data: toCSV(headers, rows), mime: "text/csv;charset=utf-8", altExt: "txt" });
}
function exportStockCSV(){
  var rows = state.parts.map(function(p){

  });
  downloadCSV("cosesa_stock_repuestos", ["Repuesto","Código","Marca","Usado en","Mínimo","Máximo","Stock actual","Estado"], rows);

function exportHistorialCSV(){
  var rows = state.maintenances.map(function(rec){

    return [rec.numero||"", rec.fecha, m?m.nombre:(rec.equipoTexto||"Equipo de planta"), rec.solicitud?rec.solicitud.obra:"", rec.solicitud?rec.solicitud.cliente:"", rec.taskNombre, rec.trabajo||"", rec.medidor==null?"":rec.medidor, m?UNIT_LABEL[m.meterType]:"", rec.tecnico, partes, rec.estado, rec.cargadoPor||""];
  });
  downloadCSV("cosesa_historial_mantenimientos", ["N° orden","Fecha","Unidad / equipo","Obra","Cliente","Tarea","Trabajo","Medidor","Unidad medidor","Técnico","Repuestos consumidos","Estado","Cargado por"], rows);

function exportMovimientosCSV(){
  var TIPOLBL = { consumo:"Consumo", ingreso:"Ingreso", ajuste:"Ajuste manual", reversion:"Reversión" };

  });

  function partRow(partId, qty){

  function filasRepuestos(){

  function refreshShort(){

    '</div>';
    document.getElementById("ordTask").onchange = function(){

      document.getElementById("ordMeterLbl").textContent = "Medidor actual ("+UNIT_LABEL[u]+")";
      document.getElementById("ordMeter").value = hasMeter(m,u) ? meterOf(m,u) : "";

  document.getElementById("ordAddPart").onclick = function(){

  document.getElementById("ordSubmit").onclick = function(){

    var tech = document.getElementById("ordTech").value.trim();
    if(!tech){ toast("Indicá el técnico responsable", "err"); return; }
    var fecha = document.getElementById("ordFecha").value || todayISO();
    var notas = document.getElementById("ordNotas").value.trim();
    var m = getMachine(document.getElementById("ordMachine").value);
    var t = m ? getTask(m, (document.getElementById("ordTask")||{}).value) : null;
    var meterInp = document.getElementById("ordMeter");
    var meter = m && meterInp && meterInp.value!=="" ? Math.max(0, Number(meterInp.value)||0) : null;
    var numero = proximoNumeroOrden();
    var faltante = false;
    var partesUsadas = filasRepuestos().map(function(x){
      var p = getPart(x.partId);
      var applied = Math.min(x.qty, p ? p.stock : 0);
      if(applied < x.qty) faltante = true;
      if(applied>0) applyMovement(x.partId, -applied, "consumo", "Orden "+numero+" · "+s.obra);
      return { partId: x.partId, qty: x.qty, aplicado: applied };
    });
    var u = currentUser();
    var rec = {
      id: uid("MT"), numero: numero, machineId: m ? m.id : null, taskId: t ? t.id : null,
      taskNombre: t ? t.nombre : "Correctivo", fecha: fecha, medidor: meter, tecnico: tech, notas: notas,
      trabajo: trabajo, equipoTexto: s.equipo || "",
      partesUsadas: partesUsadas, estado: "completado", faltante: faltante, cargadoPor: u ? u.nombre : "—",
      solicitud: { id: s.id, obra: s.obra, obra_codigo: s.obra_codigo, cliente: s.cliente, fecha: s.fecha,
        equipo: s.equipo, descripcion: s.descripcion, prioridad: s.prioridad, responsable: s.responsable, cargado_por: s.cargado_por }
    };
    state.maintenances.unshift(rec);
    var unidadO = m ? (t ? unidadMedidor(tUnit(t, m), m) : m.meterType) : null;
    rec.medidorUnidad = unidadO;
    if(m){

      if(t){ t.lastMeter = esTiempo(tUnit(t,m)) ? null : (meter!=null ? meter : meterOf(m, unidadO)); t.lastDate = fecha; }
    }

          .then(function(d){ if(!d.ok) toast("La orden se generó, pero no se pudo marcar el registro de la obra: "+(d.error||""), "err"); })
          .catch(function(){ toast("La orden se generó, pero no se pudo marcar el registro de la obra", "err"); })
        : Promise.resolve();
      return paso.then(cargarSolicitudes).then(function(){
        toast(faltante ? "Orden "+numero+" generada con faltante de stock" : "Orden "+numero+" generada y stock actualizado", faltante?"err":"ok");
        navigate("solicitudes");

/* ================= DOS CONTADORES POR UNIDAD (km y horas de motor) ================= */
/* m.meters = { km: número|null, horas: número|null }. m.currentMeter queda
   sincronizado con el contador principal (m.meterType) para lo que ya lo usa. */
function ensureMeters(m){
  if(!m.meters || typeof m.meters!=="object") m.meters = { km:null, horas:null };
  if(m.meters[m.meterType]==null && typeof m.currentMeter==="number" && m.currentMeter>0) m.meters[m.meterType] = m.currentMeter;
  m.currentMeter = m.meters[m.meterType] || 0;
  return m.meters;
}
function tUnit(t, m){ return t.unidad || (m ? m.meterType : "horas"); }

/* ================= PLANES POR PERÍODO (calendario) ================= */
var PERIODOS = ["dia","semana","mes","anio"];
var VENCE_LABEL = { horas:"Horas de motor", km:"Kilómetros", dia:"Por días (calendario)", semana:"Por semanas (calendario)", mes:"Por meses (calendario)", anio:"Por años (calendario)" };
function esTiempo(u){ return PERIODOS.indexOf(u)>=0; }
function opcionesVencePor(sel){
  return '<optgroup label="Por uso">'+["horas","km"].map(function(u){ return '<option value="'+u+'" '+(sel===u?"selected":"")+'>'+VENCE_LABEL[u]+'</option>'; }).join("")+'</optgroup>'+
    '<optgroup label="Por período (fecha)">'+
      '<option value="dia" '+(sel==="dia"?"selected":"")+'>Días — diario o cada X días</option>'+
      '<option value="semana" '+(sel==="semana"?"selected":"")+'>Semanas — semanal</option>'+
      '<option value="mes" '+(sel==="mes"?"selected":"")+'>Meses — mensual</option>'+
      '<option value="anio" '+(sel==="anio"?"selected":"")+'>Años — anual</option>'+
    '</optgroup>';
}
function fmtFrec(intervalo, u){
  var n = Math.round(intervalo);
  if(!esTiempo(u)) return "cada "+fmtInt(n)+" "+UNIT_LABEL[u];
  if(n===1) return { dia:"diario", semana:"semanal", mes:"mensual", anio:"anual" }[u];
  return "cada "+n+" "+UNIT_LABEL[u];
}
function capit(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function fmtCant(n, u){
  if(esTiempo(u)){ var d = Math.round(n); return d+" "+(Math.abs(d)===1 ? "día" : "días"); }
  return fmtInt(n)+" "+UNIT_LABEL[u];
}
function isoLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function sumarPeriodo(iso, n, u){
  var d = new Date(iso+"T12:00:00");
  if(u==="dia") d.setDate(d.getDate()+n);
  else if(u==="semana") d.setDate(d.getDate()+7*n);
  else {
    var meses = u==="anio" ? 12*n : n, dia = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+meses);
    var fin = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(dia, fin));
  }
  return isoLocal(d);
}
function diasEntre(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/864e5); }
function progresoTiempo(t, u){
  if(!t.lastDate) return { pct: 0, status: "nodata", remaining: null, used: null };
  var hoy = todayISO(), vence = sumarPeriodo(t.lastDate, Math.max(1, Math.round(t.intervalo)), u);
  var total = Math.max(1, diasEntre(t.lastDate, vence));
  var used = diasEntre(t.lastDate, hoy), remaining = diasEntre(hoy, vence);
  var status = remaining<0 ? "crit" : (remaining <= Math.max(1, Math.ceil(total*0.15)) ? "warn" : "ok");
  return { pct: clamp(used/total, 0, 1), status: status, remaining: remaining, used: used, vence: vence };
}
/* Texto del "último service / inicio" de un plan */
function txtUltimo(t, m, corto){
  var u = tUnit(t, m);
  if(esTiempo(u)){
    if(!t.lastDate) return corto ? 'Sin registrar' : 'último service: sin registrar';
    var pr = progresoTiempo(t, u);
    var futuro = t.lastDate > todayISO();
    if(corto) return (futuro ? 'Arranca ' : '')+fmtDate(t.lastDate)+'<br><span style="font-size:11px;">próximo: '+fmtDate(pr.vence)+'</span>';
    return (futuro ? 'empieza a contar el ' : 'desde ')+fmtDate(t.lastDate)+' · próximo: '+fmtDate(pr.vence);
  }
  if(t.lastMeter==null) return corto ? 'Sin registrar' : 'último service: sin registrar';
  return corto ? fmtInt(t.lastMeter)+' '+UNIT_LABEL[u]+'<br><span style="font-size:11px;">'+fmtDate(t.lastDate)+'</span>'
               : 'último service: '+fmtInt(t.lastMeter)+' '+UNIT_LABEL[u]+' ('+fmtDate(t.lastDate)+')';
}
/* Unidad del medidor que se registra en un service (los planes por período usan el medidor principal) */
function unidadMedidor(u, m){ return esTiempo(u) ? m.meterType : u; }
/* Al cambiar "Vence por" ajusta la frecuencia sugerida */
function ajustarFrecuencia(selUnidad, inpIntervalo, txtId){
  var prev = selUnidad.value;
  function txt(){ var el = txtId && document.getElementById(txtId); if(el){ var n = Math.round(Number(inpIntervalo.value)||0); el.textContent = n>0 ? "→ "+capit(fmtFrec(n, selUnidad.value)) : ""; } }
  selUnidad.addEventListener("change", function(){
    var u = selUnidad.value;
    if(esTiempo(u) && !esTiempo(prev)) inpIntervalo.value = 1;
    else if(!esTiempo(u) && esTiempo(prev)) inpIntervalo.value = u==="horas" ? 250 : 10000;
    prev = u; txt();
  });
  inpIntervalo.addEventListener("input", txt);
  txt();
}

function meterOf(m, unidad){ ensureMeters(m); var v = m.meters[unidad]; return typeof v==="number" ? v : 0; }
function hasMeter(m, unidad){ ensureMeters(m); return typeof m.meters[unidad]==="number"; }
function setMeter(m, unidad, v, soloSubir){
  ensureMeters(m);
  if(v==null || isNaN(v)) return false;
  var cur = m.meters[unidad];
  if(soloSubir && typeof cur==="number" && v <= cur) return false;
  m.meters[unidad] = Math.round(v*10)/10;
  if(unidad===m.meterType) m.currentMeter = m.meters[unidad];
  return true;
}
function fmtMeter(v, unidad){
  if(v==null) return "—";
  return (unidad==="horas" ? (Math.round(v*10)/10).toLocaleString("es-AR") : fmtInt(v)) + " " + UNIT_LABEL[unidad];
}
function meterSummary(m){
  ensureMeters(m);
  var partes = [];
  ["km","horas"].forEach(function(u){ if(hasMeter(m,u) || u===m.meterType) partes.push(hasMeter(m,u) ? fmtMeter(m.meters[u], u) : "— "+UNIT_LABEL[u]); });
  return partes.join(" · ");
}

/* ================= UNIDADES DE EASYTRACK ================= */
var EASYTRACK_UNIDADES = [
  ["AA953OH","Berlingo Uno"], ["AF134IJ","Berlingo Dos"], ["AF799IF","Berlingo Tres"], ["AG899RR","Kangoo RR"],
  ["MZF033","Mercedes Sprinter"], ["AC285LK","Diecisiete Veintiuno"], ["AD441ZA",""], ["AF465JO",""],
  ["AG899RP",""], ["AH033TE",""], ["MMR266",""]
];
function normPatente(p){ return String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function findByPatente(p){ var n = normPatente(p); return n ? state.machines.find(function(m){ return normPatente(m.patente)===n; }) : null; }
function nuevaUnidadEasytrack(patente, alias){
  var p = normPatente(patente);
  return { id: "ET_"+p, nombre: alias ? alias+" ("+p+")" : p, patente: p, tipo:"vehiculo", motor:"", serie:"",
    meterType:"km", currentMeter:0, meters:{ km:null, horas:null },
    tasks:[{ id:"ET_"+p+"_T1", nombre:"Service general", intervalo:10000, unidad:"km", parts:[], lastMeter:null, lastDate:null }],
    notes:"", easytrack:{ dias:{} } };
}
function sembrarUnidadesEasytrack(st){
  if(st.easytrackUnidadesV1) return false;
  EASYTRACK_UNIDADES.forEach(function(u){
    var p = normPatente(u[0]);
    if(!st.machines.some(function(m){ return normPatente(m.patente)===p; })) st.machines.push(nuevaUnidadEasytrack(p, u[1]));
  });
  st.easytrackUnidadesV1 = true;
  return true;
}

/* ================= IMPORTAR REPORTE DE EASYTRACK ================= */
function openEasytrackModal(){
  if(!isAdmin()){ toast("Solo quien administra Mantenimiento puede importar el reporte de Easytrack", "err"); return; }
  showModal(
    '<div class="modal-body" style="max-height:84vh; overflow-y:auto;">'+
      '<h3>Importar reporte de Easytrack</h3>'+
      '<p>En Easytrack: <b>Reportes → Reporte Kilómetros/Horas</b>, elegí el período, después <b>clic derecho sobre la tabla → Exportar → Excel (.xlsx)</b> (o CSV) y subí ese archivo acá.</p>'+
      '<div class="field"><label>Archivo exportado de Easytrack</label><input type="file" id="etFile" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" /></div>'+
      '<div class="help">Se suman los km y las horas de motor de cada día a la unidad con esa patente. Los días que ya se importaron no se vuelven a sumar, y el día de hoy se saltea porque todavía no terminó.</div>'+
      '<div id="etPreview" style="margin-top:14px;"></div>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave" disabled>Importar</button></div>'
  );

    prev.innerHTML = '<div class="help">Leyendo el archivo…</div>';
    document.getElementById("mSave").disabled = true;
    var fd = new FormData(); fd.append("archivo", f);
    fetch(API+"/easytrack/leer", { method:"POST", body: fd, credentials:"same-origin", headers:{ "Accept":"application/json" } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok){ prev.innerHTML = '<div class="banner banner-crit"><svg><use href="#i-alert-circle"/></svg><div>'+escapeHtml(d.error||"No se pudo leer el archivo")+'</div></div>'; return; }
        plan = armarPlanEasytrack(d.registros);

      })

    render();
  };
}
function armarPlanEasytrack(registros){
  var hoy = todayISO();
  var porPat = {};
  registros.forEach(function(r){
    if(!r.fecha || r.fecha >= hoy) return;
    var p = normPatente(r.patente); if(!p) return;
    (porPat[p] = porPat[p] || {}); porPat[p][r.fecha] = { h: +r.horas||0, km: +r.km||0 };   /* último valor por día */
  });
  var filas = Object.keys(porPat).sort().map(function(p){
    var m = findByPatente(p);
    var dias = porPat[p], nuevos = 0, cambiados = 0, dKm = 0, dH = 0;
    var previos = (m && m.easytrack && m.easytrack.dias) || {};
    Object.keys(dias).forEach(function(f){
      var a = previos[f], b = dias[f];
      if(!a){ nuevos++; dKm += b.km; dH += b.h; }
      else if(Math.abs(a.km-b.km)>0.05 || Math.abs(a.h-b.h)>0.005){ cambiados++; dKm += b.km-a.km; dH += b.h-a.h; }
    });
    var fechas = Object.keys(dias).sort();
    return { patente:p, m:m, dias:dias, nuevos:nuevos, cambiados:cambiados, dKm:dKm, dH:dH, desde:fechas[0], hasta:fechas[fechas.length-1] };
  });
  return { filas: filas, hayCambios: filas.some(function(f){ return f.nuevos+f.cambiados>0; }) };
}
function renderPlanEasytrack(plan, adv){
  if(!plan.filas.length) return '<div class="banner banner-warn"><svg><use href="#i-alert"/></svg><div>El archivo no tiene días completos para importar (el día de hoy se saltea).</div></div>';
  var html = adv.length ? '<div class="banner banner-warn"><svg><use href="#i-alert"/></svg><div>'+adv.map(escapeHtml).join("<br>")+'</div></div>' : '';
  html += '<div class="table-wrap"><table style="min-width:560px;"><thead><tr><th>Patente</th><th>Unidad</th><th>Período</th><th>Días nuevos</th><th class="td-num">+ km</th><th class="td-num">+ horas</th></tr></thead><tbody>'+
    plan.filas.map(function(f){
      var unidad = f.m ? escapeHtml(f.m.nombre)
        : '<label style="display:flex; gap:6px; align-items:center; margin:0; font-weight:600; color:var(--ink);"><input type="checkbox" data-et-crear="'+f.patente+'" checked style="width:15px; height:15px;"> Crear unidad nueva</label>';
      var dias = f.nuevos + (f.cambiados ? ' <span class="cell-muted">(+'+f.cambiados+' corregido/s)</span>' : '');
      return '<tr><td class="mono cell-strong">'+f.patente+'</td><td>'+unidad+'</td><td class="mono cell-muted" style="font-size:12px;">'+fmtDate(f.desde)+(f.hasta!==f.desde?' → '+fmtDate(f.hasta):'')+'</td><td>'+dias+'</td>'+
        '<td class="td-num">'+(Math.round(f.dKm*10)/10).toLocaleString("es-AR")+'</td><td class="td-num">'+(Math.round(f.dH*10)/10).toLocaleString("es-AR")+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  if(!plan.hayCambios) html += '<div class="help" style="margin-top:10px;">Todos esos días ya estaban importados: no hay nada nuevo para sumar.</div>';
  return html;
}
function aplicarPlanEasytrack(plan, crear){
  var res = { dias:0, unidades:0, creadas:0 };
  plan.filas.forEach(function(f){
    var m = f.m || findByPatente(f.patente);
    if(!m){
      if(!crear[f.patente]) return;
      m = nuevaUnidadEasytrack(f.patente, "");
      state.machines.push(m); res.creadas++;
    }
    ensureMeters(m);
    m.easytrack = m.easytrack || { dias:{} };
    m.easytrack.dias = m.easytrack.dias || {};
    var dKm = 0, dH = 0, n = 0;
    Object.keys(f.dias).forEach(function(fecha){
      var a = m.easytrack.dias[fecha], b = f.dias[fecha];
      if(a && Math.abs(a.km-b.km)<=0.05 && Math.abs(a.h-b.h)<=0.005) return;
      dKm += b.km - (a ? a.km : 0); dH += b.h - (a ? a.h : 0); n++;
      m.easytrack.dias[fecha] = b;
    });
    if(!n) return;
    setMeter(m, "km", (m.meters.km||0) + dKm, false);
    setMeter(m, "horas", (m.meters.horas||0) + dH, false);
    m.easytrack.ultimaImportacion = todayISO();
    res.dias += n; res.unidades++;
  });
  return res;
}

/* ---------- Estado de la sincronización automática con Easytrack ---------- */
function cargarEstadoEasytrack(){
  var box = document.getElementById("etEstado");
  if(!box) return;
  apiJSON("GET", API+"/easytrack/estado").then(function(res){
    box = document.getElementById("etEstado");
    if(!box || !res.d.ok) return;
    var d = res.d, ult = (d.corridas||[])[0];
    var txt, cls;
    if(!d.configurado){
      cls = "banner-info";
      txt = '<b>Sincronización automática con Easytrack: sin configurar.</b> Falta cargar el usuario y la contraseña de Easytrack en el servidor. Mientras tanto podés usar "Importar Easytrack" con el Excel del reporte.';
    } else if(!ult){
      cls = "banner-info";
      txt = '<b>Easytrack conectado.</b> Los km y horas de motor se cargan solos todos los días a las '+String(d.hora).padStart(2,"0")+':00. Todavía no corrió ninguna sincronización.';
    } else if(ult.ok===1){
      cls = "banner-info";
      txt = '<b>Easytrack conectado</b> · se sincroniza solo todos los días a las '+String(d.hora).padStart(2,"0")+':00. Última: '+escapeHtml(fmtFechaHoraUTC(ult.fin||ult.inicio))+' — '+escapeHtml((ult.detalle||"").split("\n")[0]);
    } else if(ult.ok===0){
      cls = "banner-crit";
      txt = '<b>La última sincronización con Easytrack falló</b> ('+escapeHtml(fmtFechaHoraUTC(ult.fin||ult.inicio))+'): '+escapeHtml(ult.detalle||"")+'. Se vuelve a intentar en la próxima corrida.';
    } else {
      cls = "banner-info"; txt = '<b>Sincronizando con Easytrack…</b>';
    }
    box.innerHTML = '<div class="banner '+cls+'" style="align-items:center;"><svg><use href="#i-refresh"/></svg><div style="flex:1;">'+txt+'</div>'+
      (d.configurado && isAdmin() ? '<button class="btn btn-secondary btn-sm" data-action="sync-easytrack"><svg><use href="#i-refresh"/></svg>Sincronizar ahora</button>' : '')+'</div>';
  });
}
function fmtFechaHoraUTC(s){
  if(!s) return "—";
  var d = new Date(String(s).replace(" ","T")+"Z");
  if(isNaN(d)) return s;
  return d.toLocaleString("es-AR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function sincronizarEasytrackAhora(btn){
  if(btn){ btn.disabled = true; btn.textContent = "Sincronizando…"; }
  apiJSON("POST", API+"/easytrack/sincronizar", {}).then(function(res){
    toast(res.d.mensaje || res.d.error || "Listo", res.d.ok ? "ok" : "err");
    return apiJSON("GET", API+"/estado").then(function(r2){
      if(r2.d.ok && pendingSaves===0){ serverVersion = r2.d.version; state = normalizeState(r2.d.doc); delete state.__sembrado; }
      render();
    });
  });
}

/* ================= PLANES PREDETERMINADOS ================= */
/* state.planesTipo: catálogo de planes (nombre, frecuencia y si vence por
   horas o km) que se pueden asignar a cualquier unidad. Los repuestos son
   propios de cada unidad, por eso el catálogo no los lleva. */
function sembrarPlanesTipo(st){
  if(Array.isArray(st.planesTipo) && st.planesTiposV1) return false;
  var lista = Array.isArray(st.planesTipo) ? st.planesTipo : [];
  function agregar(nombre, intervalo, unidad){
    var clave = (nombre+"|"+intervalo+"|"+unidad).toLowerCase();
    if(lista.some(function(p){ return (p.nombre+"|"+p.intervalo+"|"+p.unidad).toLowerCase()===clave; })) return;
    lista.push({ id: uid("PL"), nombre: nombre, intervalo: intervalo, unidad: unidad });
  }
  agregar("Service Motor", 250, "horas");
  agregar("Service Motor", 10000, "km");
  agregar("Service general", 10000, "km");
  (st.machines||[]).forEach(function(m){ (m.tasks||[]).forEach(function(t){ agregar(t.nombre, t.intervalo, t.unidad || m.meterType); }); });
  st.planesTipo = lista;
  st.planesTiposV1 = true;
  return true;
}
function planesTipoOrdenados(){
  return (state.planesTipo||[]).slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre) || (a.unidad<b.unidad?-1:1) || a.intervalo-b.intervalo; });
}
function getPlanTipo(id){ return (state.planesTipo||[]).find(function(p){ return p.id===id; }); }
function planTipoLabel(p){ return p.nombre+" ("+fmtFrec(p.intervalo, p.unidad)+")"; }
function existePlanTipo(nombre, intervalo, unidad){
  var c = (nombre+"|"+intervalo+"|"+unidad).toLowerCase();
  return (state.planesTipo||[]).some(function(p){ return (p.nombre+"|"+p.intervalo+"|"+p.unidad).toLowerCase()===c; });
}

/* Opciones del desplegable de planes para una unidad. */
function opcionesPlan(m, seleccionado, permitirCrear){
  var html = '';
  if(m.tasks.length){
    html += '<optgroup label="Planes de esta unidad">'+m.tasks.map(function(t){
      return '<option value="'+t.id+'" '+(t.id===seleccionado?"selected":"")+'>'+escapeHtml(t.nombre)+' ('+fmtFrec(t.intervalo, tUnit(t,m))+')</option>';
    }).join("")+'</optgroup>';
  }
  if(permitirCrear){
    var ya = {};
    m.tasks.forEach(function(t){ ya[(t.nombre+"|"+t.intervalo+"|"+tUnit(t,m)).toLowerCase()] = 1; });
    var tipos = planesTipoOrdenados().filter(function(p){ return !ya[(p.nombre+"|"+p.intervalo+"|"+p.unidad).toLowerCase()]; });
    if(tipos.length){
      html += '<optgroup label="Agregar un plan predeterminado">'+tipos.map(function(p){
        return '<option value="tpl:'+p.id+'" '+("tpl:"+p.id===seleccionado?"selected":"")+'>'+escapeHtml(planTipoLabel(p))+'</option>';
      }).join("")+'</optgroup>';
    }
    html += '<option value="new" '+(seleccionado==="new"?"selected":"")+'>➕ Crear plan nuevo…</option>';
  }
  return html;
}

/* ---------- Editor de repuestos (filas: repuesto + cantidad) ---------- */
function editorRepuestos(contenedorId, filas, onChange){
  var cont = document.getElementById(contenedorId);
  var partsSorted = state.parts.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  cont.innerHTML = '<div class="parts-check" data-rep-list></div>'+
    '<button type="button" class="btn btn-secondary btn-sm" data-rep-add style="margin-top:8px;"><svg><use href="#i-plus"/></svg>Agregar repuesto</button>';
  var list = cont.querySelector("[data-rep-list]");
  function fila(partId, qty){
    var div = document.createElement("div");
    div.className = "part-row"; div.setAttribute("data-rep-row",""); div.style.alignItems = "center";
    div.innerHTML = '<div style="flex:1; min-width:0;"><select class="rep-part" style="width:100%;">'+
        partsSorted.map(function(p){ return '<option value="'+p.id+'" '+(p.id===partId?"selected":"")+'>'+escapeHtml(p.nombre)+' — '+escapeHtml(p.codigo)+' (stock: '+p.stock+')</option>'; }).join("")+
      '</select></div>'+
      '<input type="number" class="rep-qty" value="'+(qty||1)+'" min="0" style="width:74px;" />'+
      '<button type="button" class="btn btn-ghost btn-sm" data-rep-del title="Quitar"><svg><use href="#i-x"/></svg></button>';
    div.querySelector("[data-rep-del]").onclick = function(){ div.remove(); if(onChange) onChange(); };
    div.querySelector(".rep-part").onchange = function(){ if(onChange) onChange(); };
    div.querySelector(".rep-qty").oninput = function(){ if(onChange) onChange(); };
    list.appendChild(div);
  }
  (filas||[]).forEach(function(f){ fila(f.partId, f.qty); });
  cont.querySelector("[data-rep-add]").onclick = function(){
    if(!partsSorted.length){ toast("No hay repuestos en el catálogo", "err"); return; }
    fila(partsSorted[0].id, 1); if(onChange) onChange();
  };
  return {
    valores: function(){
      var acc = {}, orden = [];
      list.querySelectorAll("[data-rep-row]").forEach(function(row){
        var pid = row.querySelector(".rep-part").value;
        var q = Math.max(0, Math.round(Number(row.querySelector(".rep-qty").value)||0));
        if(!pid || q<=0) return;
        if(!(pid in acc)) orden.push(pid);
        acc[pid] = (acc[pid]||0) + q;
      });
      return orden.map(function(pid){ return { partId: pid, qty: acc[pid] }; });
    },
    marcarFaltantes: function(){
      var cortos = [];
      list.querySelectorAll("[data-rep-row]").forEach(function(row){
        var p = getPart(row.querySelector(".rep-part").value);
        var q = Math.max(0, Math.round(Number(row.querySelector(".rep-qty").value)||0));
        var corto = !!p && q > p.stock;
        row.classList.toggle("short", corto);
        if(corto) cortos.push(p.nombre);
      });
      return cortos;
    }
  };
}

/* ---------- Generar mantenimiento ---------- */
function viewGenerar(preId, preTask){
  setHeader("Generar mantenimiento");
  var machine = preId ? getMachine(preId) : null;

  '</select></div>';

  html += '</div>';

  function renderTaskArea(){
