    if(!m.tasks.length && !admin){
      wrap.innerHTML = '<div class="banner banner-warn"><svg><use href="#i-alert"/></svg><div>Esta unidad todavía no tiene planes de mantenimiento. Pedile a quien administra Mantenimiento que le asigne uno.</div></div>';
      return;
    }
    wrap.innerHTML =
      '<div class="field"><label>Plan de mantenimiento</label><select id="genTask">'+opcionesPlan(m, sel, admin)+'</select>'+
        (admin ? '<div class="help">Elegí un plan de la unidad, agregale uno predeterminado o creá uno nuevo.</div>' : '')+'</div>'+
      '<div id="genPlanForm"></div>'+
      '<div class="field-row">'+
        '<div class="field"><label id="genMeterLbl">Medidor actual</label><input type="number" id="genMeter" value="" min="0" step="any" /></div>'+
        '<div class="field"><label>Fecha</label><input type="date" id="genDate" value="'+todayISO()+'" /></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Técnico responsable</label><input type="text" id="genTech" placeholder="Nombre y apellido" /></div>'+
        '<div class="field"><label>Notas (opcional)</label><input type="text" id="genNotes" placeholder="Observaciones del service" /></div>'+
      '</div>'+
      '<div class="field"><label>Repuestos que se van a descontar del stock</label><div class="help" id="genRepHelp"></div><div id="genReps" style="margin-top:8px;"></div></div>'+
      '<div id="genShortBanner"></div>'+
      '<div id="genEstado"></div>'+
      '<button class="btn btn-primary btn-block" id="genSubmit"><svg><use href="#i-check"/></svg>Generar mantenimiento y actualizar stock</button>';
    document.getElementById("genTask").onchange = function(){ cambiarPlan(m, true); };
    document.getElementById("genMeter").oninput = function(){ renderEstado(m); };
    document.getElementById("genSubmit").onclick = function(){ submitMaintenance(m); };
    cambiarPlan(m, true);
  }

  function planElegido(m){
    var v = document.getElementById("genTask").value;
    if(v==="new") return { tipo:"nuevo" };
    if(v.indexOf("tpl:")===0) return { tipo:"tpl", plan:getPlanTipo(v.slice(4)) };
    return { tipo:"tarea", t:getTask(m, v) };
  }
  function unidadElegida(m){
    var pe = planElegido(m);
    if(pe.tipo==="tarea") return pe.t ? tUnit(pe.t, m) : m.meterType;
    var s = document.getElementById("gpUnidad");
    return s ? s.value : (pe.plan ? pe.plan.unidad : m.meterType);
  }
  function cambiarPlan(m, recargarRepuestos){
    var pe = planElegido(m);
    var form = document.getElementById("genPlanForm");
    if(pe.tipo==="tarea"){
      form.innerHTML = "";
    } else {
      var p = pe.plan || { nombre:"", intervalo: m.meterType==="horas"?250:10000, unidad: m.meterType };
      form.innerHTML = '<div class="card card-pad" style="background:var(--surface-2); margin-bottom:16px;">'+
        '<div class="cell-strong" style="margin-bottom:10px;">'+(pe.tipo==="nuevo" ? "Plan nuevo" : "Se agrega a la unidad el plan predeterminado")+'</div>'+
        '<div class="field"><label>Nombre del plan</label><input type="text" id="gpNombre" value="'+escapeHtml(p.nombre)+'" placeholder="Ej: Cambio de aceite y filtros" '+(pe.tipo==="tpl"?"readonly":"")+' /></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Vence por</label><select id="gpUnidad" '+(pe.tipo==="tpl"?"disabled":"")+'>'+opcionesVencePor(p.unidad)+'</select></div>'+
          '<div class="field"><label>Frecuencia (cada cuántas)</label><input type="number" id="gpIntervalo" min="1" value="'+p.intervalo+'" '+(pe.tipo==="tpl"?"readonly":"")+' /><div class="help" id="gpFrecTxt"></div></div>'+
        '</div>'+
        (pe.tipo==="nuevo" ? '<label style="display:flex; gap:8px; align-items:center; font-weight:600; color:var(--ink); margin:0;"><input type="checkbox" id="gpGuardar" checked style="width:16px; height:16px;"> Guardarlo también como plan predeterminado (para usarlo en otras unidades)</label>' : '')+
        '<div class="help" style="margin-top:8px;">El plan empieza a contar desde este service: el próximo vence al medidor de hoy + la frecuencia (o, si es por período, en la fecha del service + el período). Los repuestos que cargues abajo quedan como los de este plan para esta unidad.</div>'+
      '</div>';
      ajustarFrecuencia(document.getElementById("gpUnidad"), document.getElementById("gpIntervalo"), "gpFrecTxt");
      document.getElementById("gpUnidad").addEventListener("change", function(){ syncMeter(m); renderEstado(m); });
    }
    syncMeter(m);
    if(recargarRepuestos){
      var filas = pe.tipo==="tarea" && pe.t ? pe.t.parts.map(function(tp){ return { partId: tp.partId, qty: tp.qty }; }) : [];
      rep = editorRepuestos("genReps", filas, refreshShort);
      document.getElementById("genRepHelp").textContent = pe.tipo==="tarea"
        ? "Vienen los repuestos del plan. Podés ajustar cantidades, quitar o agregar solo para este service."
        : "Agregá los repuestos que lleva este plan (opcional).";
    }
    refreshShort();
    renderEstado(m);
  }
  function syncMeter(m){
    var uP = unidadElegida(m), u = unidadMedidor(uP, m);
    document.getElementById("genMeterLbl").textContent = "Medidor actual ("+UNIT_LABEL[u]+")"+(esTiempo(uP) ? " — opcional" : "");
    document.getElementById("genMeter").value = hasMeter(m,u) ? meterOf(m,u) : "";
  }
  function refreshShort(){
    if(!rep) return;
    var cortos = rep.marcarFaltantes();
    document.getElementById("genShortBanner").innerHTML = cortos.length ?
      '<div class="banner banner-crit"><svg><use href="#i-alert-circle"/></svg><div><b>Stock insuficiente</b> para: '+escapeHtml(cortos.join(", "))+'. Podés generar igual: el stock quedará en 0 para esos ítems y se marcará el mantenimiento como "con faltante".</div></div>' : "";
  }
  function renderEstado(m){
    var pe = planElegido(m);
    var box = document.getElementById("genEstado");
    if(pe.tipo!=="tarea" || !pe.t){ box.innerHTML = ""; return; }
    var pr = taskProgress(pe.t, m), meta = statusMeta(pr.status);
    box.innerHTML = '<div class="banner '+(pr.status==="crit"?"banner-crit":pr.status==="warn"?"banner-warn":"banner-info")+'"><svg><use href="#'+meta.icon+'"/></svg><div>Estado actual de este plan: <b>'+meta.label+'</b>'+(pr.status==="nodata" ? ' · todavía no hay un service registrado.' : ' · '+(pr.remaining>=0? "faltan "+fmtCant(pr.remaining, tUnit(pe.t,m)) : "vencido hace "+fmtCant(-pr.remaining, tUnit(pe.t,m)))+'.')+'</div></div>';
  }

  function submitMaintenance(m){
    var pe = planElegido(m);
    var t = pe.t;
    var meterRaw = document.getElementById("genMeter").value;
    var unidadT = unidadElegida(m), unidadMed = unidadMedidor(unidadT, m);
    if(meterRaw==="" && !esTiempo(unidadT)){ toast("Cargá la lectura actual del medidor ("+UNIT_LABEL[unidadT]+")", "err"); return; }
    var meter = meterRaw==="" ? null : Number(meterRaw);
    var partes = rep ? rep.valores() : [];
    if(pe.tipo!=="tarea"){
      var nombre = document.getElementById("gpNombre").value.trim();
      var intervalo = Math.round(Number(document.getElementById("gpIntervalo").value)||0);
      if(!nombre){ toast("Poné un nombre para el plan", "err"); return; }
      if(intervalo<1){ toast("Indicá cada cuántas "+UNIT_LABEL[unidadT]+" se hace el plan", "err"); return; }
      t = { id: uid("T"), nombre: nombre, intervalo: intervalo, unidad: unidadT,
            parts: partes.map(function(x){ return { partId:x.partId, qty:x.qty }; }), lastMeter: null, lastDate: null };
      m.tasks.push(t);
      var guardar = document.getElementById("gpGuardar");
      if(pe.tipo==="nuevo" && guardar && guardar.checked && !existePlanTipo(nombre, intervalo, unidadT)){
        state.planesTipo.push({ id: uid("PL"), nombre: nombre, intervalo: intervalo, unidad: unidadT });
      }
    }
    if(!t){ toast("Elegí un plan", "err"); return; }
    var date = document.getElementById("genDate").value || todayISO();
    var tech = document.getElementById("genTech").value.trim();
    var notes = document.getElementById("genNotes").value.trim();
    var numero = proximoNumeroOrden();
    var faltante = false;
    var partesUsadas = partes.map(function(x){
      var p = getPart(x.partId);
      var applied = Math.min(x.qty, p ? p.stock : 0);
      if(applied < x.qty) faltante = true;
      if(applied>0) applyMovement(x.partId, -applied, "consumo", "Orden "+numero+" · "+m.nombre+" · "+t.nombre);
      return { partId: x.partId, qty: x.qty, aplicado: applied };
    });
    var u = currentUser();
    state.maintenances.unshift({
      id: uid("MT"), numero: numero, machineId: m.id, taskId: t.id, taskNombre: t.nombre,
      fecha: date, medidor: meter, medidorUnidad: unidadMed, tecnico: tech || "Sin asignar", notas: notes,
      partesUsadas: partesUsadas, estado: "completado", faltante: faltante, cargadoPor: u ? u.nombre : "—"
    });
    t.lastMeter = esTiempo(unidadT) ? null : meter;
    t.lastDate = date;
    if(meter!=null) setMeter(m, unidadMed, meter, true);
    saveState();
    toast(faltante ? "Mantenimiento "+numero+" generado con faltante de stock" : "Mantenimiento "+numero+" generado y stock actualizado", faltante?"err":"ok");
    navigate("flota", { id:m.id });
  }

  document.getElementById("genMachine").onchange = renderTaskArea;
  if(machine) renderTaskArea();
}

function openPlanTipoModal(id){
  if(!isAdmin()){ toast("Solo quien administra Mantenimiento puede editar los planes", "err"); return; }
  var p = id ? getPlanTipo(id) : null;
  showModal('<div class="modal-body"><h3>'+(p?"Editar plan predeterminado":"Nuevo plan predeterminado")+'</h3>'+
    '<div class="field"><label>Nombre del plan</label><input type="text" id="ptNombre" value="'+escapeHtml(p?p.nombre:"")+'" placeholder="Ej: Cambio de aceite y filtros" /></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Vence por</label><select id="ptUnidad">'+opcionesVencePor(p ? p.unidad : "km")+'</select></div>'+
      '<div class="field"><label>Frecuencia (cada cuántas)</label><input type="number" id="ptIntervalo" min="1" value="'+(p?p.intervalo:10000)+'" /><div class="help" id="ptFrecTxt"></div></div>'+
    '</div></div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar</button></div>');
  ajustarFrecuencia(document.getElementById("ptUnidad"), document.getElementById("ptIntervalo"), "ptFrecTxt");
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = function(){
    var nombre = document.getElementById("ptNombre").value.trim();
    var unidad = document.getElementById("ptUnidad").value;
    var intervalo = Math.round(Number(document.getElementById("ptIntervalo").value)||0);
    if(!nombre){ toast("Poné un nombre para el plan", "err"); return; }
    if(intervalo<1){ toast("Indicá la frecuencia", "err"); return; }
    var dup = (state.planesTipo||[]).find(function(x){ return x.id!==(p&&p.id) && (x.nombre+"|"+x.intervalo+"|"+x.unidad).toLowerCase()===(nombre+"|"+intervalo+"|"+unidad).toLowerCase(); });
    if(dup){ toast("Ya existe ese plan predeterminado", "err"); return; }
    if(p){ p.nombre = nombre; p.unidad = unidad; p.intervalo = intervalo; }
    else state.planesTipo.push({ id: uid("PL"), nombre: nombre, intervalo: intervalo, unidad: unidad });
    saveState(); closeModal(); toast("Plan guardado"); render();
  };
}
function borrarPlanTipo(id){
  var p = getPlanTipo(id); if(!p) return;
  confirmModal({ title:"¿Eliminar este plan predeterminado?", body:"Se quita <b>"+escapeHtml(planTipoLabel(p))+"</b> del catálogo. Las unidades que ya lo tienen asignado lo conservan.",
    confirmLabel:"Eliminar", danger:true, onConfirm:function(){
      state.planesTipo = state.planesTipo.filter(function(x){ return x.id!==id; });
      saveState(); toast("Plan eliminado del catálogo"); render();
    } });
}
function openAsignarPlanModal(id){
  var p = getPlanTipo(id); if(!p) return;
  var tiene = function(m){ return m.tasks.some(function(t){ return (t.nombre+"|"+t.intervalo+"|"+tUnit(t,m)).toLowerCase()===(p.nombre+"|"+p.intervalo+"|"+p.unidad).toLowerCase(); }); };
  var lista = state.machines.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  showModal('<div class="modal-body" style="max-height:82vh; overflow-y:auto;"><h3>Asignar plan a unidades</h3><p><b>'+escapeHtml(planTipoLabel(p))+'</b></p>'+
    '<div class="parts-picker" style="max-height:340px;">'+lista.map(function(m){
      var ya = tiene(m);
      return '<label class="part-pick-row"><input type="checkbox" data-asig="'+m.id+'" '+(ya?"checked disabled":"")+' /><span class="ppr-name">'+escapeHtml(m.nombre)+(ya?' <span class="ppr-code">ya lo tiene</span>':'')+'</span><span class="ppr-code">'+meterSummary(m)+'</span></label>';
    }).join("")+'</div>'+
    (esTiempo(p.unidad)
      ? '<div class="field" style="margin-top:12px;"><label>Comienza a correr desde (fecha)</label><input type="date" id="asigFecha" value="'+todayISO()+'" /><div class="help">El primer vencimiento es esta fecha + '+escapeHtml(fmtFrec(p.intervalo, p.unidad))+'. Puede ser una fecha pasada (último service hecho) o futura.</div></div>'
      : '<div class="help">El plan empieza a contar desde el medidor actual de cada unidad. Si una unidad todavía no tiene medidor cargado, queda "Sin datos" hasta su primer service.</div>')+'</div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Asignar</button></div>');
  document.querySelector("#modalRoot .modal").style.maxWidth = "560px";
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = function(){
    var n = 0;
    document.querySelectorAll("[data-asig]:checked:not(:disabled)").forEach(function(cb){
      var m = getMachine(cb.dataset.asig); if(!m) return;
      if(esTiempo(p.unidad)){
        var f = (document.getElementById("asigFecha")||{}).value || null;
        m.tasks.push({ id: uid("T"), nombre: p.nombre, intervalo: p.intervalo, unidad: p.unidad, parts: [], lastMeter: null, lastDate: f });
        n++; return;
      }
      var arranca = hasMeter(m, p.unidad) ? meterOf(m, p.unidad) : null;
      m.tasks.push({ id: uid("T"), nombre: p.nombre, intervalo: p.intervalo, unidad: p.unidad, parts: [], lastMeter: arranca, lastDate: arranca!=null ? todayISO() : null });
      n++;
    });
    if(!n){ toast("No elegiste ninguna unidad", "err"); return; }
    saveState(); closeModal(); toast("Plan asignado a "+n+" unidad(es)"); render();
  };
}

/* ================= RENDER DISPATCH ================= */
function render(){
  renderSidebarNav();
  var resetB = document.getElementById("resetBtn");
  if(resetB) resetB.style.display = isAdmin() ? "" : "none";
  var v = route.view;
  if(v==="usuarios"){ v = "dashboard"; route = { view:"dashboard", params:{} }; }
  if(v==="alertas" && !isAdmin()){ toast("Esa sección es solo para administradores", "err"); v = "dashboard"; route = { view:"dashboard", params:{} }; }
  if(v==="dashboard") viewDashboard();
  else if(v==="flota") route.params.id ? viewMachineDetail(route.params.id) : viewFlota();
  else if(v==="planes") viewPlanes();
  else if(v==="solicitudes") viewSolicitudes();
  else if(v==="orden") viewOrden(route.params.id);
  else if(v==="generar") viewGenerar(route.params.id, route.params.sub);
  else if(v==="historial") viewHistorial();
  else if(v==="stock") viewStock();
  else if(v==="movimientos") viewMovimientos();
  else if(v==="alertas") viewAlertas();
  else viewDashboard();

  document.querySelectorAll(".nav-item").forEach(function(b){ b.classList.toggle("active", b.dataset.nav===route.view || (route.view==="orden" && b.dataset.nav==="solicitudes")); });
  updateAlertDot();
  window.scrollTo(0,0);
}
function updateAlertDot(){
  var c = counts();
  document.getElementById("alertDot").hidden = (c.vencidos+c.critStock+c.solPend)===0;
}

/* ================= EVENT DELEGATION ================= */
document.addEventListener("click", function(e){
  var navEl = e.target.closest("[data-nav]");
  if(navEl){
    var view = navEl.dataset.nav, id = navEl.dataset.id, sub = navEl.dataset.sub;
    if(id){ location.hash = "#/"+view+"/"+encodeURIComponent(id)+(sub?"/"+encodeURIComponent(sub):""); }
    else navigate(view);
    return;
  }
  var act = e.target.closest("[data-action]");
  if(!act) return;
  var action = act.dataset.action;

  if(action==="sol-filter"){ window.__solFiltro = act.dataset.key; viewSolicitudes(); }
  else if(action==="sol-refresh"){ cargarSolicitudes().then(function(){ render(); toast("Solicitudes actualizadas"); }); }
  else if(action==="plan-filter"){ window.__planFilter = act.dataset.key; viewPlanes(); }
  else if(action==="plan-task-new"){ openPlanMachinePicker(); }
  else if(action==="plantipo-new"){ openPlanTipoModal(null); }
  else if(action==="plantipo-edit"){ openPlanTipoModal(act.dataset.id); }
  else if(action==="plantipo-del"){ borrarPlanTipo(act.dataset.id); }
  else if(action==="plantipo-asignar"){ openAsignarPlanModal(act.dataset.id); }

  else if(action==="hist-filter"){ window.__histEstado = act.dataset.key; viewHistorial(); }
  else if(action==="mov-filter"){ window.__movTipo = act.dataset.key; viewMovimientos(); }
  else if(action==="stock-filter"){ window.__stockFilter = act.dataset.key; viewStock(); }
  else if(action==="edit-meter"){ openMeterModal(act.dataset.id); }
  else if(action==="import-meters"){ openImportMetersModal(); }
  else if(action==="import-easytrack"){ openEasytrackModal(); }
  else if(action==="sync-easytrack"){ sincronizarEasytrackAhora(act); }
  else if(action==="alert-save-settings"){ saveAlertSettings(); }
  else if(action==="alert-simulate-send"){ simulateAlertSend(); }
  else if(action==="stock-adjust"){ openStockModal(act.dataset.id, act.dataset.dir); }
  else if(action==="stock-remito"){ openRemitoModal(); }
  else if(action==="void-maint"){ voidMaintenance(act.dataset.id); }
  else if(action==="print-maint"){ printMaintenance(act.dataset.id); }
  else if(action==="edit-consumables"){ openEditConsumablesModal(act.dataset.id); }
  else if(action==="part-new"){ openPartModal(null); }
  else if(action==="part-edit"){ openPartModal(act.dataset.id); }
  else if(action==="part-delete"){ deletePart(act.dataset.id); }
  else if(action==="export-stock"){ exportStockCSV(); }
  else if(action==="export-historial"){ exportHistorialCSV(); }
  else if(action==="export-movimientos"){ exportMovimientosCSV(); }
  else if(action==="machine-new"){ openMachineModal(null); }
  else if(action==="machine-edit"){ openMachineModal(act.dataset.id); }
  else if(action==="machine-delete"){ deleteMachine(act.dataset.id); }
  else if(action==="task-new"){ openTaskModal(act.dataset.id, null); }
  else if(action==="task-edit"){ openTaskModal(act.dataset.mid, act.dataset.id); }
  else if(action==="task-delete"){ deleteTask(act.dataset.mid, act.dataset.id); }
});

function openRemitoModal(){
  if(!isAdmin()){ toast("Solo un administrador puede cargar ingresos de stock", "err"); return; }
  var partsSorted = state.parts.slice().sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  var rowIdx = 0;
  function rowHtml(){
    rowIdx++;
    return '<div class="part-row" data-remito-row style="align-items:center;">'+
      '<div style="flex:1;"><select class="rm-part" style="width:100%;">'+
        partsSorted.map(function(p){ return '<option value="'+p.id+'">'+escapeHtml(p.nombre)+' — '+escapeHtml(p.codigo)+' (stock: '+p.stock+')</option>'; }).join("")+
      '</select></div>'+
      '<input type="number" class="rm-qty" value="1" min="1" style="width:70px;" />'+
      '<button type="button" class="btn btn-ghost btn-sm" data-remito-remove title="Quitar"><svg><use href="#i-x"/></svg></button>'+
    '</div>';
  }
  showModal(
    '<div class="modal-body" style="max-height:82vh; overflow-y:auto;">'+
      '<h3>Ingreso de stock por remito</h3>'+
      '<p class="help">Cargá varios repuestos de un mismo remito en una sola operación.</p>'+
      '<div class="field-row">'+
        '<div class="field"><label>N° de remito</label><input type="text" id="rmNumero" placeholder="Ej: 0001-00012345" /></div>'+
        '<div class="field"><label>Proveedor (opcional)</label><input type="text" id="rmProveedor" placeholder="Ej: Fleetguard SA" /></div>'+
      '</div>'+
      '<div class="field"><label>Ítems del remito</label><div id="rmRows" class="parts-check">'+rowHtml()+'</div>'+
        '<button type="button" class="btn btn-secondary btn-sm" id="rmAddRow" style="margin-top:8px;"><svg><use href="#i-plus"/></svg>Agregar ítem</button>'+
      '</div>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Registrar ingreso</button></div>'
  );
  function bindRemove(row){
    var btn = row.querySelector("[data-remito-remove]");
    btn.onclick = function(){
      if(document.querySelectorAll("[data-remito-row]").length<=1){ toast("Tiene que quedar al menos un ítem", "err"); return; }
      row.remove();
    };
  }
  document.querySelectorAll("[data-remito-row]").forEach(bindRemove);
  document.getElementById("rmAddRow").onclick = function(){
    var wrap = document.getElementById("rmRows");
    var div = document.createElement("div");
    div.innerHTML = rowHtml();
    var row = div.firstChild;
    wrap.appendChild(row);
    bindRemove(row);
  };
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = function(){
    var numero = document.getElementById("rmNumero").value.trim();
    var proveedor = document.getElementById("rmProveedor").value.trim();
    if(!numero){ toast("Ingresá el número de remito", "err"); return; }
    var ref = "Remito N° "+numero+(proveedor?" · "+proveedor:"");
    var rows = document.querySelectorAll("[data-remito-row]");
    var count = 0;
    rows.forEach(function(row){
      var partId = row.querySelector(".rm-part").value;
      var qty = Math.max(0, Math.round(Number(row.querySelector(".rm-qty").value)||0));
      if(partId && qty>0){ applyMovement(partId, qty, "ingreso", ref); count++; }
    });
    if(count===0){ toast("Cargá al menos un ítem con cantidad mayor a cero", "err"); return; }
    saveState();
    toast("Stock actualizado: "+count+" ítem(s) ingresado(s) por "+ref);
    closeModal(); render();
  };
}

  );

    var marca = document.getElementById("pMarca").value.trim() || "—";
    var codigo = document.getElementById("pCodigo").value.trim() || "—";
    var min = Math.max(0, Math.round(Number(document.getElementById("pMin").value)||0));
    var max = Math.max(min, Math.round(Number(document.getElementById("pMax").value)||min));
    if(!nombre){ toast("Ingresá un nombre para el repuesto", "err"); return; }
    if(editing){
      editing.nombre = nombre; editing.marca = marca; editing.codigo = codigo; editing.min = min; editing.max = max;
      toast("Repuesto actualizado");
    } else {
      var stockInicial = Math.max(0, Math.round(Number(document.getElementById("pStockInicial").value)||0));
      var p = { id: uid("P"), nombre: nombre, tipo: "", marca: marca, codigo: codigo, min: min, max: max, stock: 0, usadoEn: [] };
      state.parts.push(p);
      if(stockInicial>0) applyMovement(p.id, stockInicial, "ingreso", "Alta de repuesto nuevo en el catálogo");
      toast("Repuesto creado");
    }
    saveState(); closeModal(); render();
  };
}
function deletePart(partId){
  if(!isAdmin()){ toast("Solo un administrador puede editar el catálogo", "err"); return; }
  var p = getPart(partId);
  if(!p) return;
  var usedBy = state.machines.filter(function(m){ return m.tasks.some(function(t){ return t.parts.some(function(tp){ return tp.partId===partId; }); }); });
  if(usedBy.length>0){
    toast("No se puede eliminar: está en el plan de "+usedBy.map(function(m){return m.nombre;}).join(", ")+". Quitalo de esas tareas primero.", "err");
    return;
  }
  confirmModal({
    title: "¿Eliminar este repuesto del catálogo?",
    body: "Se eliminará <b>"+escapeHtml(p.nombre)+"</b> ("+escapeHtml(p.codigo)+") del catálogo. El historial de movimientos ya registrado se conserva.",
    confirmLabel: "Eliminar repuesto",
    danger: true,
    onConfirm: function(){
      state.parts = state.parts.filter(function(x){ return x.id!==partId; });
      saveState();
      toast("Repuesto eliminado del catálogo");
      render();
    }
  });
}

    if(otra && (!editing || otra.id!==editing.id)){ toast("Esa patente ya está en "+otra.nombre, "err"); return; }

      editing.motor = motor; editing.serie = serie; editing.nombre = nombre; editing.patente = patente;

      if(vk!=="") setMeter(nm, "km", Number(vk), false);

      '<div class="field"><label>Repuestos que consume esta tarea</label>'+
        '<div style="display:flex; gap:8px; margin-bottom:8px;">'+
          '<input type="search" id="tPartFilter" placeholder="Filtrar repuestos por nombre o código…" style="flex:1;" />'+
          '<button type="button" class="btn btn-secondary btn-sm" id="tNewPartBtn"><svg><use href="#i-plus"/></svg>Nuevo repuesto</button>'+
        '</div>'+
        '<div id="tNewPartForm" class="card card-pad" style="display:none; margin-bottom:10px; background:var(--surface-2);">'+
          '<div class="field-row">'+
            '<div class="field"><label>Nombre</label><input type="text" id="npNombre" placeholder="Ej: Filtro de aceite" /></div>'+
            '<div class="field"><label>Cantidad por service</label><input type="number" id="npQty" value="1" min="1" /></div>'+

  function syncInicio(forzar){
    var u = document.getElementById("tUnidad").value;
    var tiempo = esTiempo(u), fInp = document.getElementById("tInicioFecha");
    document.getElementById("tInicio").style.display = tiempo ? "none" : "";
    fInp.style.display = tiempo ? "" : "none";
    document.getElementById("tInicioHelp").textContent = tiempo
      ? "Fecha desde la que empieza a correr el plan (por ejemplo, la del último service hecho, o una fecha futura). El primer vencimiento es esta fecha + la frecuencia. Si la dejás vacía queda \"Sin datos\" hasta el primer mantenimiento."
      : "Medidor desde el que se cuenta la frecuencia (por ejemplo, el del último service hecho). El próximo vence en este valor + la frecuencia. Si lo dejás vacío queda \"Sin datos\" hasta el primer mantenimiento.";
    if(tiempo){
      document.getElementById("tInicioLbl").textContent = "Comienza a correr desde (fecha)";
      if(forzar) fInp.value = (editing && esTiempo(tUnit(editing, m)) && editing.lastDate) ? editing.lastDate : (editing && esTiempo(tUnit(editing, m)) ? "" : todayISO());
      return;
    }
    document.getElementById("tInicioLbl").textContent = "Comienza a contar desde ("+UNIT_LABEL[u]+")";
    var inp = document.getElementById("tInicio");
    if(forzar){
      if(editing && tUnit(editing, m)===u) inp.value = editing.lastMeter!=null ? editing.lastMeter : "";

  document.getElementById("npAdd").onclick = function(){

    var codigo = document.getElementById("npCodigo").value.trim() || "—";

    picker.insertBefore(row, picker.firstChild);
    row.querySelector('[data-part-check]').addEventListener("change", function(){
      var qi = document.querySelector('[data-part-qty][data-for="'+p.id+'"]');
      if(qi) qi.disabled = !this.checked;
    });
    document.getElementById("npNombre").value=""; document.getElementById("npMarca").value=""; document.getElementById("npCodigo").value=""; document.getElementById("npQty").value="1";

    if(!nombre){ toast("Ingresá un nombre para el plan", "err"); return; }
    var parts = [];
    document.querySelectorAll('[data-part-check]:checked').forEach(function(cb){
      var qtyInput = document.querySelector('[data-part-qty][data-for="'+cb.value+'"]');
      var qty = Math.max(1, Math.round(Number(qtyInput.value)||1));
      parts.push({ partId: cb.value, qty: qty });
    });
    var unidadSel = document.getElementById("tUnidad").value;
    var iniRaw = document.getElementById("tInicio").value;
    var inicio = iniRaw==="" ? null : Math.max(0, Number(iniRaw));
    if(esTiempo(unidadSel)){
      var fIni = document.getElementById("tInicioFecha").value || null;
      if(editing){
        editing.nombre = nombre; editing.intervalo = intervalo; editing.parts = parts; editing.unidad = unidadSel;
        editing.lastMeter = null; editing.lastDate = fIni;

        m.tasks.push({ id: uid("T"), nombre: nombre, intervalo: intervalo, unidad: unidadSel, parts: parts, lastMeter: null, lastDate: fIni });
        var g2 = document.getElementById("tGuardarTipo");

          state.planesTipo.push({ id: uid("PL"), nombre: nombre, intervalo: intervalo, unidad: unidadSel });

        toast("Plan agregado a la unidad");
      }
      saveState(); closeModal(); render(); return;
    }
    if(editing){
      var cambioInicio = inicio !== editing.lastMeter || tUnit(editing, m)!==unidadSel;
      editing.nombre = nombre; editing.intervalo = intervalo; editing.parts = parts; editing.unidad = unidadSel;
      if(cambioInicio){ editing.lastMeter = inicio; editing.lastDate = inicio!=null ? (editing.lastDate || todayISO()) : null; }
      toast("Plan actualizado");
    } else {
      m.tasks.push({ id: uid("T"), nombre: nombre, intervalo: intervalo, unidad: unidadSel, parts: parts, lastMeter: inicio, lastDate: inicio!=null ? todayISO() : null });
      var g = document.getElementById("tGuardarTipo");
      if(g && g.checked && g.parentNode.style.display!=="none" && !existePlanTipo(nombre, intervalo, unidadSel)){
        state.planesTipo.push({ id: uid("PL"), nombre: nombre, intervalo: intervalo, unidad: unidadSel });
      }
      toast("Plan agregado a la unidad");
    }
    saveState(); closeModal(); render();
  };
}

function voidMaintenance(id){

  if(!rec || rec.estado==="anulado") return;
  confirmModal({
    title: "¿Anular este mantenimiento?",

      rec.partesUsadas.forEach(function(pu){

      rec.estado = "anulado";
      saveState();
      toast("Mantenimiento anulado, stock restituido");
      render();
    }
  });

        '<div><b>Prioridad</b>'+(PRIO_TXT[sol.prioridad]||"—")+'</div>'+
        '<div><b>Responsable en obra</b>'+escapeHtml(sol.responsable||"—")+'</div>'+
        '<div><b>Cargado por</b>'+escapeHtml(sol.cargado_por||"—")+'</div>'+
        '<div style="grid-column:1/-1;"><b>Pedido / problema informado</b>'+escapeHtml(sol.descripcion||"—")+'</div>'+
      '</div>' : '')+
    '<table><thead><tr><th>Repuesto</th><th>Código</th><th style="text-align:center;">Cant. solicitada</th><th style="text-align:center;">Cant. aplicada</th></tr></thead><tbody>'+partsRows+'</tbody></table>'+
    '<div class="sign"><div>Firma técnico responsable</div><div>Firma supervisor / control de calidad</div></div>'+
    '<div class="foot">COSESA Servicios Industriales · Documento generado desde la Plataforma COSESA · Mantenimiento el '+fmtDate(todayISO())+'.</div>'+
  '</body></html>';

  var inClaude = !!(window.claude && window.claude.use);
  if(inClaude){
    /* El visor de Claude bloquea ventanas e impresión: se descarga la orden
       como HTML que se imprime sola al abrirla. */
    var printable = html.replace('</body></html>',
      '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},300);});<\/script></body></html>');
    saveFile({ filename: "orden_"+rec.id+".html", data: printable, mime: "text/html;charset=utf-8",
      okMsg: "Orden descargada: abrila y se imprime sola" });
    return;
  }
  var win = window.open("", "_blank", "width=820,height=1000");
  if(!win){ toast("El navegador bloqueó la ventana de impresión. Habilitá pop-ups para este sitio.", "err"); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function(){ try{ win.print(); }catch(e){} }, 300);
}

function openEditConsumablesModal(id){
  if(!isAdmin()){ toast("Solo un administrador puede editar los consumibles de una orden", "err"); return; }
  var rec = state.maintenances.find(function(r){ return r.id===id; });
  if(!rec || rec.estado==="anulado") return;
  var m = getMachine(rec.machineId);
  var rows = rec.partesUsadas.map(function(pu){
    var p = getPart(pu.partId);
    if(!p) return "";
    var aplicado = pu.aplicado!=null ? pu.aplicado : pu.qty;
    return '<tr data-ec-row data-part="'+pu.partId+'" data-prev="'+aplicado+'">'+
      '<td>'+escapeHtml(p.nombre)+'<div class="cell-muted" style="font-size:11px;">'+escapeHtml(p.codigo)+' · stock actual: '+p.stock+'</div></td>'+
      '<td><input type="number" class="ec-input" data-ec-part="'+pu.partId+'" value="'+aplicado+'" min="0" style="width:80px;" /></td>'+
    '</tr>';
  }).join("");
  if(!rows){ toast("Esta orden no tiene repuestos asociados", "err"); return; }
  showModal(
    '<div class="modal-body">'+
      '<h3>Editar consumibles</h3>'+
      '<p>'+escapeHtml(m?m.nombre:"—")+' · '+escapeHtml(rec.taskNombre)+' · '+fmtDate(rec.fecha)+'</p>'+
      '<div class="help">Ajustá la cantidad realmente consumida. El stock se corrige automáticamente por la diferencia.</div>'+
      '<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>Repuesto</th><th>Cantidad aplicada</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-secondary" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar cambios</button></div>'
  );
  document.getElementById("mCancel").onclick = closeModal;
  document.getElementById("mSave").onclick = function(){
    var faltante = false;
    document.querySelectorAll("[data-ec-row]").forEach(function(row){
      var partId = row.dataset.part;
      var prev = Number(row.dataset.prev);
      var input = row.querySelector("[data-ec-part]");
      var next = Math.max(0, Math.round(Number(input.value)||0));
      var delta = next - prev;
      if(delta!==0){
        applyMovement(partId, -delta, "ajuste", "Ajuste de consumibles · orden "+rec.id);
      }
      var p = getPart(partId);
      var pu = rec.partesUsadas.find(function(x){ return x.partId===partId; });
      if(pu){ pu.qty = next; pu.aplicado = next; }
      if(p && p.stock < 0){ p.stock = 0; }
    });
    rec.partesUsadas.forEach(function(pu){ if((pu.aplicado||0) < (pu.qty||0)) faltante = true; });
    rec.faltante = faltante;
    saveState();
    toast("Consumibles actualizados y stock corregido");
    closeModal(); render();
  };
}

/* ================= GLOBAL SEARCH ================= */
function searchIndex(q){
  q = q.toLowerCase();
  var machines = state.machines.filter(function(m){ return (m.nombre+" "+(m.motor||"")+" "+(m.serie||"")).toLowerCase().indexOf(q)>=0; }).slice(0,5);
  var parts = state.parts.filter(function(p){ return (p.nombre+" "+p.codigo+" "+p.marca).toLowerCase().indexOf(q)>=0; }).slice(0,5);
  return { machines: machines, parts: parts };
}
function renderSearchResults(q){
  var box = document.getElementById("searchResults");
  if(!q || q.length<2){ box.hidden = true; box.innerHTML=""; return; }
  var res = searchIndex(q);
  var html = "";
  if(res.machines.length){
    html += '<div class="sr-group">Máquinas y vehículos</div>';
    res.machines.forEach(function(m){
      html += '<div class="sr-item" data-sr-nav="flota" data-sr-id="'+m.id+'"><div class="sr-ic"><svg><use href="#'+machineIcon(m.tipo)+'"/></svg></div><div class="sr-tx"><div class="n">'+escapeHtml(m.nombre)+'</div><div class="s">'+escapeHtml(m.motor||TYPE_LABEL[m.tipo])+'</div></div></div>';
    });
  }
  if(res.parts.length){
    html += '<div class="sr-group">Repuestos</div>';
    res.parts.forEach(function(p){
      html += '<div class="sr-item" data-sr-nav="stock" data-sr-q="'+escapeHtml(p.nombre)+'"><div class="sr-ic"><svg><use href="#i-box"/></svg></div><div class="sr-tx"><div class="n">'+escapeHtml(p.nombre)+'</div><div class="s">'+escapeHtml(p.codigo)+' · '+escapeHtml(p.marca)+'</div></div></div>';
    });
  }
  if(!res.machines.length && !res.parts.length){ html = '<div class="sr-empty">Sin resultados para "'+escapeHtml(q)+'"</div>'; }
  box.innerHTML = html;
  box.hidden = false;
  box.querySelectorAll("[data-sr-nav]").forEach(function(el){
    el.addEventListener("click", function(){
      if(el.dataset.srId){ navigate(el.dataset.srNav, {id: el.dataset.srId}); }
      else if(el.dataset.srQ){ window.__stockQuery = el.dataset.srQ; navigate("stock"); }
      box.hidden = true;
      document.getElementById("globalSearch").value = "";
    });
  });
}
document.getElementById("globalSearch").addEventListener("input", function(e){
  renderSearchResults(e.target.value.trim());
});
document.getElementById("globalSearch").addEventListener("focus", function(e){
  if(e.target.value.trim().length>=2) renderSearchResults(e.target.value.trim());
});
document.addEventListener("click", function(e){
  var box = document.getElementById("searchResults");
  if(!box || box.hidden) return;
  if(!e.target.closest(".topbar-search")){ box.hidden = true; }
});
document.getElementById("globalSearch").addEventListener("keydown", function(e){
  if(e.key==="Escape"){ document.getElementById("searchResults").hidden = true; e.target.blur(); return; }
  if(e.key==="Enter"){
    var q = e.target.value.trim().toLowerCase();
    var m = state.machines.find(function(mm){ return mm.nombre.toLowerCase().indexOf(q)>=0; });
    if(m){ navigate("flota", {id:m.id}); document.getElementById("searchResults").hidden=true; return; }
    var p = state.parts.find(function(pp){ return (pp.nombre+" "+pp.codigo).toLowerCase().indexOf(q)>=0; });
    if(p){ window.__stockQuery=q; navigate("stock"); document.getElementById("searchResults").hidden=true; }
  }
});
