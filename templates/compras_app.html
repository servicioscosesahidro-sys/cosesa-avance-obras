<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · Plataforma COSESA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo, sobria y precisa, como el resto de la Plataforma COSESA.
   IDEA: la orden de compra impresa: un formulario con membrete, número y firmas.
   PICTURE: la tabla de órdenes y el formulario de la OC son la imagen.
   COLOUR and TYPE: azul COSESA #1d2a4a, amarillo #f2c230 de acento, fondo claro; Inter.
   LAYOUT: barra lateral de secciones, contenido en tarjetas, logo arriba a la derecha. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f8,#11151d);--card:light-dark(#fff,#1a2030);--ink:light-dark(#1b2333,#e8ecf3);--soft:light-dark(#5b6678,#a7b1c2);
--faint:light-dark(#8a93a3,#7d889a);--line:light-dark(#dfe4ec,#2b3447);--navy:#1d2a4a;--navy2:light-dark(#1d2a4a,#2c3d66);--gold:#f2c230;
--ok:#1f8a4c;--okbg:light-dark(#e5f5eb,#173326);--warn:#b26a00;--warnbg:light-dark(#fff3dc,#3a2b12);--bad:#b42318;--badbg:light-dark(#fde8e6,#3d1c1a);
--blue:#1f6fb5;--bluebg:light-dark(#e6f0fa,#17263a);--muted:light-dark(#eef1f5,#232b3c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:#dfe6f3;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brand{font-weight:800;letter-spacing:.2px;color:#fff;font-size:17px;padding:4px 10px 2px}
aside .sub{font-size:12px;color:#9fb0cc;padding:0 10px 16px}
aside h4{font-size:11.5px;color:#8ea0c0;margin:16px 10px 6px;font-weight:700}
aside a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;color:#e6ecf7;text-decoration:none;font-weight:500;cursor:pointer}
aside a:hover{background:rgba(255,255,255,.07)} aside a.on{background:var(--gold);color:#1d2a4a;font-weight:700}
.badge{background:rgba(255,255,255,.16);border-radius:20px;padding:0 8px;font-size:12px;font-weight:700}
aside a.on .badge{background:rgba(29,42,74,.15)}
main{padding:0 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(16px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:22px;margin:0;line-height:1.15}.top .crumb{font-size:12px;color:var(--faint);font-weight:600}
.top .r{display:flex;align-items:center;gap:14px}
.logo{height:46px;width:auto;border-radius:6px;background:#fff;padding:3px 6px}
.yo{font-size:12.5px;color:var(--soft);text-align:right}.yo input{width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:13px}
.wrap{padding:22px clamp(16px,3vw,32px);max-width:1240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 4px}.hint{color:var(--faint);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid #f2c23099;border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--navy2)}.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.g{background:var(--gold);border-color:var(--gold);color:#1d2a4a}
.btn.d{color:var(--bad)}.btn.s{padding:5px 10px;min-height:32px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.3px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill.abierta,.pill.solicitada{background:var(--bluebg);color:var(--blue)}.pill.cerrada,.pill.aprobada{background:var(--okbg);color:var(--ok)}
.pill.anulada,.pill.rechazada{background:var(--badbg);color:var(--bad)}.pill.gris{background:var(--muted);color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}.tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.info{background:var(--bluebg);color:var(--blue)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.ok{background:var(--okbg);color:var(--ok)}.banner.bad{background:var(--badbg);color:var(--bad)}
.lines td{padding:6px 6px}.lines input,.lines select{padding:7px 8px;font-size:14px}
.tot{display:grid;grid-template-columns:auto 140px;gap:4px 18px;justify-content:end;margin-top:10px;font-size:14.5px}
.tot b{font-size:17px}
.empty{padding:30px;text-align:center;color:var(--faint)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.kv div{font-size:14px}.kv span{display:block;font-size:12px;color:var(--faint);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:50;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;max-width:620px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px;font-size:18px}.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.radio{display:flex;gap:10px;flex-wrap:wrap}.radio label{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.radio label:has(input:checked){border-color:var(--gold);background:var(--warnbg)}.radio input{width:auto}
.scroll{overflow-x:auto}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi span{display:block;font-size:12px;color:var(--faint);font-weight:600}.kpi b{font-size:clamp(18px,2.2vw,24px);font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--soft);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.mat td,table.mat th{white-space:nowrap;font-size:13px;padding:6px 8px}table.mat tr.sel td{background:var(--warnbg)}
table.compacta{font-size:13.5px}table.compacta tr.sel td{background:var(--warnbg)}
tr.filtros th{padding:4px 4px 8px;background:var(--muted)}tr.filtros .fc{font-size:12.5px;padding:4px 6px;border-radius:6px;min-width:0;width:100%;max-width:130px;font-weight:500}tr.filtros th{vertical-align:top}#fcLimpiar{display:block}
@media(max-width:600px){tr.filtros{display:none}}table.compacta th{padding:6px 8px}table.compacta td{padding:6px 8px;white-space:nowrap;vertical-align:middle}
table.compacta .pill{font-size:11.5px;padding:1px 8px}table.compacta tbody tr:nth-child(even) td{background:light-dark(#fafbfd,#1d2435)}
.menu-btn{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none}.menu-btn{display:inline-flex}.yo{display:none}.logo{height:36px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--faint);font-size:12px}.stack td:empty{display:none}.stack.compacta td{white-space:normal}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => (p||"x") + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const hoy = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const ahora = () => { const d = new Date(); return hoy()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const fFecha = s => { if(!s) return "—"; const [y,m,d] = String(s).slice(0,10).split("-"); return d && m && y ? d+"/"+m+"/"+y : s; };
const num = v => { const n = Number(String(v??"").replace(/\./g,"").replace(",",".")); return isFinite(n) ? n : 0; };
const numIn = v => { if(typeof v === "number") return v; const s = String(v??"").trim(); if(!s) return 0; return /,\d{1,4}$/.test(s) ? num(s) : (Number(s.replace(/,/g,"")) || 0); };

const ocNum = n => "OC" + String(n).padStart(7,"0");
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const API = "/compras/api";
const VERS = {}, RAW = { maestros:{}, solicitudes:{}, ordenes:{} };
let SEQ = 0, PERM = { aprobar:false, admin:false }, URLS = {}, sincronizando = false;
const ADMIN_MAESTROS = ["centros","depositos","compradores","formasPago","aprobadores"];
const puedeM = tipo => PERM.admin || !ADMIN_MAESTROS.includes(tipo);
async function api(metodo, url, body){
  let r;
  try{ r = await fetch(url, { method: metodo, credentials:"same-origin", headers: body ? {"Content-Type":"application/json","Accept":"application/json"} : {"Accept":"application/json"}, body: body ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new Error("Sin conexión con el servidor"); }
  if(r.redirected && /\/login/.test(r.url)){ location.href = r.url; throw new Error("Tu sesión venció"); }
  let d = null; try{ d = await r.json(); }catch(e){}
  if(!r.ok || !d || d.ok === false){ const err = new Error((d && d.error) || ("Error del servidor ("+r.status+")")); err.status = r.status; throw err; }
  return d;
}
function aplicarDocs(docs){
  docs.forEach(x => { if(!RAW[x.col]) return; const k = x.col+"/"+x.id; if(x.borrado){ delete RAW[x.col][x.id]; delete VERS[k]; } else { RAW[x.col][x.id] = x.data; VERS[k] = x.v; } });
  const nuevo = {}; Object.keys(MAESTROS).forEach(k => nuevo[k] = []); const cnt = {};
  Object.values(RAW.maestros).sort((a,b) => (a.parte||0)-(b.parte||0)).forEach(x => { if(nuevo[x.tipo]){ nuevo[x.tipo].push(...(x.items||[])); cnt[x.tipo] = Math.max(cnt[x.tipo]||0, (x.parte||0)+1); } });
  S.m = nuevo; S._chunks = cnt; S.sol = Object.values(RAW.solicitudes); S.oc = Object.values(RAW.ordenes);
}
async function sincronizar(){
  if(sincronizando) return; sincronizando = true;
  try{
    const d = await api("GET", API+"/datos?desde="+SEQ);
    if(d.completo){ RAW.maestros = {}; RAW.solicitudes = {}; RAW.ordenes = {}; }
    const cambio = d.docs.length > 0 || d.completo || S.cfg.proxNumero !== d.prox_oc;
    aplicarDocs(d.docs);
    SEQ = d.seq; S.cfg.proxNumero = d.prox_oc;
    ME = { id: d.usuario.username, name: d.usuario.nombre }; PERM = { aprobar: !!d.usuario.aprobar, admin: !!d.usuario.admin }; URLS = d.urls || {};
    const primera = !S.listo.oc; S.listo.m = S.listo.sol = S.listo.oc = true;
    if(primera) pintarUsuario();
    if(cambio) render();
  }catch(e){ if(!S.listo.oc) $("#view").innerHTML = '<div class="banner bad">No se pudieron leer los datos de Compras: '+esc(e.message)+'. Recargá la página.</div>'; }
  finally{ sincronizando = false; }
}
async function escribir(col, id, data){
  try{ const r = await api("POST", API+"/doc", { col, id, data, v: VERS[col+"/"+id] || 0 }); VERS[col+"/"+id] = r.v; RAW[col][id] = r.data; aplicarDocs([]); return r; }
  catch(e){ if(e.status === 409) await sincronizar(); throw e; }
}
async function guardarMaestro(tipo){
  const items = S.m[tipo], partes = Math.max(1, Math.ceil(items.length / CHUNK)), viejos = S._chunks[tipo] || 0;
  try{
    for(let i=0;i<partes;i++) await escribir("maestros", tipo+"-"+i, { tipo, parte:i, items: items.slice(i*CHUNK, (i+1)*CHUNK) });
    for(let i=partes;i<viejos;i++){ await api("POST", API+"/borrar", { col:"maestros", id: tipo+"-"+i }); delete RAW.maestros[tipo+"-"+i]; }
    aplicarDocs([]);
  }catch(e){ toast(e.message, true); await sincronizar(); render(true); throw e; }
}
S._chunks = {};
async function guardarDoc(col, obj){
  try{ await escribir(col, obj.id, JSON.parse(JSON.stringify(obj))); render(); }
  catch(e){ toast(e.message, true); throw e; }
}

const prov = id => S.m.proveedores.find(p => p.id === id);
const centro = id => S.m.centros.find(c => c.id === id);
const depo = id => S.m.depositos.find(d => d.id === id);
const depTxt = d => d ? (d.codigo ? d.codigo+" · " : "")+d.nombre : "—";
const depCod = id => { const d = depo(id); return d ? (d.codigo || d.nombre) : "?"; };
const depsOrdenados = () => S.m.depositos.slice().sort((a,b) => String(a.codigo||a.nombre).localeCompare(String(b.codigo||b.nombre), "es", {numeric:true}));
/* Reparto de un ítem entre depósitos: [{depositoId, cantidad}]. Sin reparto = todo al depósito de la OC */
const repartoDe = (it, o) => (it.dist && it.dist.length) ? it.dist : [{ depositoId: o.depositoId, cantidad: it.cantidad }];
const origenesDe = l => !l || !l.origen ? [] : (Array.isArray(l.origen) ? l.origen : [l.origen]);
/* Centro de costos al que va el gasto de una parte de un ítem: si el ítem se reparte entre varios depósitos, el del depósito; si no, el del ítem o el de la OC */
function centroDeParte(o, l, dep){ const d = depo(dep); return (((l.dist||[]).length > 1 && d && d.centroId) || l.centroId || o.centroId || ""); }
/* Imputaciones de gasto de una OC: [{centroId, monto (sin IVA), fecha}]. base "recibido": por remito/factura cargado (fecha del remito); "comprometido": todo a la fecha de emisión */
function imputaciones(o, base){
  const out = [], its = o.items || [], pr = l => Number(l.precio) || 0;
  const todo = fecha => its.forEach(l => repartoDe(l, o).forEach(d => out.push({ centroId: centroDeParte(o, l, d.depositoId), monto: Number(d.cantidad||0) * pr(l), fecha })));
  if(base === "comprometido"){ todo(o.fecha); return out; }
  const recs = o.recepciones || [];
  // Solo se imputa lo recibido con remito o factura. (Las OC de ejemplo, que no tienen remitos, se toman completas a la fecha de cierre)
  if(!recs.length){ if(o.ejemplo && o.estado === "cerrada") todo(String((o.cierre && o.cierre.fecha) || o.fecha).slice(0,10)); return out; }
  recs.forEach(r => { const dist = r.dist || Object.fromEntries(Object.entries(r.cantidades||{}).map(([lid,v]) => [lid, {[o.depositoId]: v}]));
    Object.entries(dist).forEach(([lid, deps]) => { const l = its.find(i => i.lid === lid); if(!l) return;
      Object.entries(deps).forEach(([dep, q]) => out.push({ centroId: centroDeParte(o, l, dep), monto: Number(q||0) * pr(l), fecha: r.fecha || o.fecha })); }); });
  return out;
}
const centrosDeOc = o => { const c = []; (o.items||[]).forEach(l => repartoDe(l, o).forEach(d => { const k = centroDeParte(o, l, d.depositoId); if(k && !c.includes(k)) c.push(k); })); if(!c.length && o.centroId) c.push(o.centroId); return c; };
const ccCod = id => { const c = centro(id); return c ? (c.codigo || c.nombre) : "—"; };
const centrosTxtOc = o => { const c = centrosDeOc(o); return c.length > 1 ? "Varios: "+c.map(ccCod).join("; ") : centroTxt(c[0] || o.centroId); };
const abrevDeps = it => (it.dist && it.dist.length > 1) ? "(Dep. "+it.dist.map(d => depCod(d.depositoId)).join("; ")+")" : "";
/* Siglas del comprador: inicial del nombre + inicial del apellido (CG, JS, IL). Si se repiten, se suma la 2da letra del apellido (JSA). */
const CONECTORES = ["de","del","la","las","los","y"];
function partesNombre(n){ return String(n||"").trim().split(/\s+/).filter(w => w && !CONECTORES.includes(w.toLowerCase())); }
function siglasAuto(nombre, idPropio){
  const p = partesNombre(nombre); if(!p.length) return "";
  const ini = p[0], ap = p.length > 1 ? p[p.length-1] : "";
  const usadas = S.m.compradores.filter(c => c.id !== idPropio).map(siglasComprador);
  let sg = (ini[0] + (ap[0]||"")).toUpperCase();
  for(let k=1; usadas.includes(sg) && k < Math.max(ap.length, 2); k++) sg = (ini[0] + ap[0] + (ap[k]||ini[k]||String(k))).toUpperCase();
  return sg;
}
function siglasComprador(c){ if(!c) return ""; if(c.siglas) return String(c.siglas).toUpperCase(); const p = partesNombre(c.nombre); return (((p[0]||"")[0]||"") + ((p.length>1 ? p[p.length-1] : "")[0]||"")).toUpperCase(); }
const siglasDe = id => siglasComprador(S.m.compradores.find(c => c.id === id)) || "—";
const nombreDe = (tipo, id) => { const x = S.m[tipo].find(y => y.id === id); return x ? (tipo === "depositos" ? depTxt(x) : (x.nombre || x.razon || x.descripcion)) : "—"; };
const centroTxt = id => { const c = centro(id); return c ? (c.codigo ? c.codigo+" · " : "")+c.nombre : "—"; };
const provTxt = id => { const p = prov(id); return p ? p.razon + (p.cuit ? " ("+p.cuit+")" : "") : "—"; };
const opts = (tipo, sel, vacio) => (vacio!==false ? '<option value="">'+(vacio||"Elegí…")+'</option>' : '') + S.m[tipo].map(x => '<option value="'+esc(x.id)+'" '+(x.id===sel?"selected":"")+'>'+esc(tipo==="centros" ? (x.codigo?x.codigo+" · ":"")+x.nombre : tipo==="proveedores" ? x.razon+(x.cuit?" · "+x.cuit:"") : tipo==="aprobadores" ? x.nombre+" ("+(x.iniciales||"")+")" : tipo==="depositos" ? depTxt(x) : tipo==="compradores" ? siglasComprador(x)+" · "+x.nombre : x.nombre)+'</option>').join("");
const iniciales = a => a ? (a.iniciales || a.nombre.split(/\s+/).map(w=>w[0]).join("").toUpperCase()) : "";

/* Selector con búsqueda (datalist) para listas largas */
function buscador(tipo, idSel, inputId, placeholder){
  const lista = S.m[tipo];
  const txt = x => tipo==="proveedores" ? x.razon+(x.cuit?" · "+x.cuit:"") : tipo==="centros" ? (x.codigo?x.codigo+" · ":"")+x.nombre : (x.codigo?x.codigo+" · ":"")+(x.descripcion||x.nombre);

    '<datalist id="'+inputId+'L">'+lista.map(x => '<option value="'+esc(txt(x))+'"></option>').join("")+'</datalist>';
}
function leerBuscador(tipo, inputId){
  const el = document.getElementById(inputId), v = el.value.trim(); if(!v) return "";
  const txt = x => tipo==="proveedores" ? x.razon+(x.cuit?" · "+x.cuit:"") : tipo==="centros" ? (x.codigo?x.codigo+" · ":"")+x.nombre : (x.codigo?x.codigo+" · ":"")+(x.descripcion||x.nombre);
  const x = S.m[tipo].find(y => txt(y) === v) || S.m[tipo].find(y => norm(txt(y)).includes(norm(v)));
  return x ? x.id : null;
}

function ocDeItem(s, it){

  const ref = it.oc ? S.oc.find(o => o.id === it.oc.id) : (s.ocNumero ? S.oc.find(o => o.numero === s.ocNumero) : null);
  return ref && ref.estado !== "anulada" ? ref : null;
}
function lineaDeOc(o, s, it){ return (o.items||[]).find(l => origenesDe(l).some(x => x.solId === s.id && x.lid === it.lid)) || (o.items||[]).find(l => l.descripcion === it.descripcion); }
function estadoItem(o, s, it){
  if(o.estado === "cerrada") return "recibido";
  const l = lineaDeOc(o, s, it); if(!l) return "pendiente";
  const rec = (o.recepciones||[]).reduce((a,r) => a + Number((r.cantidades||{})[l.lid]||0), 0);
  return rec >= l.cantidad ? "recibido" : rec > 0 ? "parcial" : "pendiente";

function baseDesdeItems(keys, avisar){
  const sel = keys.map(k => { const [sid, lid] = k.split("|"); const s = S.sol.find(x => x.id === sid); const it = s && (s.items||[]).find(i => i.lid === lid); return s && it ? { s, it } : null; }).filter(Boolean);
  const cuenta = (lst, f) => { const c = {}; lst.forEach(x => { const v = f(x); if(v) c[v] = (c[v]||0) + Number(x.it.cantidad||1); }); return Object.entries(c).sort((a,b) => b[1]-a[1]); };
  const centros = cuenta(sel, x => x.s.centroId), deps = cuenta(sel, x => x.s.depositoId), provs = cuenta(sel, x => x.s.proveedorId);
  const depBase = deps[0] ? deps[0][0] : "", ccBase = centros[0] ? centros[0][0] : "";
  // Artículos iguales (mismo artículo y unidad) de distintas solicitudes se juntan en un solo ítem
  const grupos = [], porClave = {};
  sel.forEach(x => { const k = (x.it.articuloId || norm((x.it.codigo||"")+" "+x.it.descripcion))+"|"+norm(x.it.unidad||"");
    if(!porClave[k]){ porClave[k] = { lista: [] }; grupos.push(porClave[k]); } porClave[k].lista.push(x); });
  const avisos = [];
  const items = grupos.map(g => {
    const x0 = g.lista[0].it, total = g.lista.reduce((a,x) => a + Number(x.it.cantidad||0), 0);
    const porDep = {}; g.lista.forEach(x => { const d = x.s.depositoId || depBase; porDep[d] = (porDep[d]||0) + Number(x.it.cantidad||0); });
    const dl = Object.entries(porDep).map(([depositoId, cantidad]) => ({ depositoId, cantidad }));
    const dist = (dl.length === 1 && dl[0].depositoId === depBase) ? [] : dl;
    const ccs = cuenta(g.lista, x => x.s.centroId);
    const cc = ccs[0] ? ccs[0][0] : "";
    if(ccs.length > 1 && dl.length < 2) avisos.push("<b>"+esc(x0.descripcion)+"</b> viene de solicitudes con distintos centros de costos ("+ccs.map(c => esc(ccCod(c[0]))).join(", ")+") pero va a un solo depósito: quedó en "+esc(ccCod(cc))+". Revisalo.");
    const obs = [...new Set(g.lista.map(x => x.it.obs).filter(Boolean))].join(" · ");
    return { lid: uid("l"), articuloId: x0.articuloId || null, codigo: x0.codigo || "", descripcion: x0.descripcion, unidad: x0.unidad, cantidad: total, precio: "", obs,
      centroId: cc && cc !== ccBase ? cc : "", origen: g.lista.map(x => ({ solId: x.s.id, lid: x.it.lid, cantidad: Number(x.it.cantidad||0) })), dist };
  });
  const juntados = grupos.filter(g => g.lista.length > 1).length;
  if(juntados) avisos.unshift(juntados+" artículo(s) estaban en varias solicitudes: se juntaron en un solo ítem sumando las cantidades y repartiendo entre los depósitos de cada solicitud.");
  if(avisos.length) avisar(avisos.join("<br>"));

  return { centroId: ccBase, depositoId: depBase, proveedorId: provs[0] ? provs[0][0] : "", entrega: necesita,
    obs: "Solicitudes: "+[...new Set(sel.map(x => x.s.numero))].join(", "), items };
}

/* ---------------- Órdenes de compra ---------------- */
let filtroOc = "abierta", buscaOc = "";
const pillOc = o => '<span class="pill '+o.estado+'">'+({abierta:"Abierta · emitida",cerrada:"Cerrada",anulada:"Anulada"}[o.estado]||o.estado)+'</span>'+
  (o.estado !== "anulada" ? (aprobadorDe(o) ? ' <span class="pill aprobada" title="Aprobada">✓ Aprobada</span>' : ' <span class="pill gris">Sin aprobar</span>') : '');
const totalOc = o => { const sub = (o.items||[]).reduce((s,i) => s + (i.cantidad||0)*(i.precio||0), 0); const iva = sub * (Number(o.iva)||0)/100; return { sub, iva, total: sub+iva }; };
function contenidoOc(o){ return norm([o.numero, provTxt(o.proveedorId), (prov(o.proveedorId)||{}).codigo, ...(o.items||[]).map(i => (i.codigo||"")+" "+i.descripcion), ...centrosDeOc(o).map(centroTxt), o.obs].join(" ")); }
const ordenOc = (a,b) => (b.fecha||"").localeCompare(a.fecha||"") || b.numero.localeCompare(a.numero);
/* Filtros por columna de la lista de OC */
const FC = { compras:{}, dep:{} };
function aplicarFiltrosCol(lista, f, modo){
  const has = (txt, q) => !q || norm(txt).includes(norm(q));
  return lista.filter(o => {
    const its = o.items || [], apr = aprobadorDe(o);
    if(!has(o.numero, f.num)) return false;
    if(f.mes && (o.fecha||"").slice(0,7) !== f.mes) return false;
    if(f.comp && siglasDe(o.compradorId) !== f.comp) return false;
    if(!has(provTxt(o.proveedorId)+" "+((prov(o.proveedorId)||{}).codigo||""), f.prov)) return false;
    if(!has(its.map(i => (i.codigo||"")+" "+i.descripcion+" "+(i.obs||"")).join(" "), f.cont)) return false;
    if(modo === "dep"){ if(f.dep && !(o.depositoId === f.dep || its.some(i => (i.dist||[]).some(d => d.depositoId === f.dep)))) return false; }
    else if(f.cc && !centrosDeOc(o).includes(f.cc)) return false;
    if(f.tmin && totalOc(o).total < numIn(f.tmin)) return false;
    if(f.tmax && totalOc(o).total > numIn(f.tmax)) return false;
    if(f.estado && o.estado !== f.estado) return false;
    if(f.aprob === "si" && !apr) return false;
    if(f.aprob === "no" && (apr || o.estado === "anulada")) return false;
    return true;
  });
}
function filaFiltros(base, f, modo){
  const sel = (k, opciones, todos) => '<select class="fc" data-f="'+k+'"><option value="">'+(todos||"Todos")+'</option>'+opciones.map(([v,t]) => '<option value="'+esc(v)+'" '+(f[k]===v?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select>';
  const txt = (k, ph) => '<input class="fc" data-f="'+k+'" placeholder="'+esc(ph)+'" value="'+esc(f[k]||"")+'">';
  const meses = [...new Set(base.map(o => (o.fecha||"").slice(0,7)).filter(Boolean))].sort().reverse().map(m => [m, MESES[Number(m.slice(5))-1]+" "+m.slice(2,4)]);
  const comps = [...new Set(base.map(o => siglasDe(o.compradorId)).filter(x => x && x !== "—"))].sort().map(x => [x,x]);
  const ccs = [...new Set(base.flatMap(o => centrosDeOc(o)).filter(Boolean))].map(id => [id, (centro(id)||{}).codigo || centroTxt(id)]).sort((a,b) => a[1].localeCompare(b[1]));
  const dps = depsOrdenados().map(d => [d.id, d.codigo || d.nombre]);
  const hay = Object.values(f).some(Boolean);
  return '<tr class="filtros">'+
    '<th>'+txt("num","N°")+'</th><th>'+sel("mes", meses, "Todas")+'</th><th>'+sel("comp", comps)+'</th><th>'+txt("prov","Proveedor")+'</th><th>'+txt("cont","Artículo")+'</th>'+
    (modo==="dep" ? '<th>'+sel("dep", dps)+'</th>' : '<th>'+sel("cc", ccs)+'</th><th><div style="display:flex;gap:3px"><input class="fc" data-f="tmin" placeholder="mín" value="'+esc(f.tmin||"")+'" inputmode="decimal"><input class="fc" data-f="tmax" placeholder="máx" value="'+esc(f.tmax||"")+'" inputmode="decimal"></div></th>')+
    '<th>'+sel("estado", [["abierta","Abierta"],["cerrada","Cerrada"],["anulada","Anulada"]])+'</th><th>'+sel("aprob", [["si","Aprobadas"],["no","Pendientes"]])+(hay ? '<button class="btn s" id="fcLimpiar" title="Quitar filtros" style="margin-top:4px;min-height:26px;padding:2px 8px">✕ Limpiar</button>' : '')+'</th></tr>';
}
function wireFiltrosCol(modo){
  const f = FC[modo === "dep" ? "dep" : "compras"];
  document.querySelectorAll(".fc").forEach(el => {
    const k = el.dataset.f;
    const go = () => { f[k] = el.value; const focoTxt = el.tagName === "INPUT"; const pos = focoTxt ? el.selectionStart : 0; render();
      if(focoTxt){ const n = document.querySelector('.fc[data-f="'+k+'"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } } };
    if(el.tagName === "SELECT") el.onchange = go; else el.oninput = go;
    el.onclick = e => e.stopPropagation();
  });
  const l = $("#fcLimpiar"); if(l) l.onclick = e => { e.stopPropagation(); Object.keys(f).forEach(k => delete f[k]); render(); };
}
function tablaOcs(lista, modo, conFiltros){
  const base = lista, f = conFiltros ? FC[modo === "dep" ? "dep" : "compras"] : null;
  if(f) lista = aplicarFiltrosCol(lista, f, modo);
  if(!lista.length && !f) return '<div class="empty">No hay órdenes de compra con ese criterio.</div>';
  const corto = (t, n) => { t = String(t||""); return t.length > n ? t.slice(0, n-1)+"…" : t; };
  const estadoCorto = o => '<span class="pill '+o.estado+'">'+({abierta:"Abierta",cerrada:"Cerrada",anulada:"Anulada"}[o.estado]||o.estado)+'</span>'+((o.recepciones||[]).length && o.estado==="abierta" ? ' <span class="hint" title="Remitos / facturas cargados">'+o.recepciones.length+' rem.</span>' : '');
  return '<table class="stack compacta"><thead><tr><th>N° OC</th><th>Fecha</th><th title="Comprador">Comp.</th><th>Proveedor</th><th>Contenido</th>'+(modo==="dep"?'<th>Depósito</th>':'<th>C. costos</th>')+(modo==="dep"?'':'<th class="n">Total</th>')+'<th>Estado</th><th title="Aprobó">Aprob.</th></tr>'+(f ? filaFiltros(base, f, modo) : '')+'</thead><tbody>'+
    (!lista.length ? '<tr><td colspan="10" class="empty">Ninguna OC coincide con los filtros.</td></tr>' : '')+
    lista.map(o => { const p = prov(o.proveedorId) || {}, its = o.items || [], cont = its.map(i => i.descripcion).join(", "), apr = aprobadorDe(o), c = centro(o.centroId), d = depo(o.depositoId);
      const multi = its.some(i => i.dist && i.dist.length > 1);
      return '<tr class="click" data-oc="'+esc(o.id)+'"><td class="mono">'+esc(o.numero)+(o.ejemplo ? ' <span class="pill gris" title="Orden de ejemplo">ej.</span>' : '')+'</td><td>'+fFecha(o.fecha).replace(/\/(\d{2})(\d{2})$/, "/$2")+'</td><td class="mono" title="'+esc(nombreDe("compradores", o.compradorId))+'">'+esc(siglasDe(o.compradorId))+'</td>'+
        '<td title="'+esc(provTxt(o.proveedorId))+'">'+esc(corto(p.razon||"—", 26))+'</td><td title="'+esc(cont)+'">'+esc(corto(cont, 34))+(its.length>1?' <span class="hint">('+its.length+')</span>':'')+'</td>'+
        (modo==="dep" ? '<td title="'+esc(nombreDe("depositos", o.depositoId))+'">'+esc(multi ? "Varios" : (d ? (d.codigo || d.nombre) : "—"))+'</td>' : (() => { const cs = centrosDeOc(o); return '<td title="'+esc(cs.map(centroTxt).join(" / "))+'">'+esc(cs.length > 1 ? cs.map(ccCod).join("; ") : (c ? (c.codigo || c.nombre) : "—"))+'</td>'; })())+
        (modo==="dep" ? '' : '<td class="n">'+money(totalOc(o).total, o.moneda)+'</td>')+
        '<td>'+estadoCorto(o)+'</td><td>'+(o.estado==="anulada" ? '—' : apr ? '<span style="color:var(--ok);font-weight:700" title="'+esc(apr.nombre)+'">✓ '+esc(apr.iniciales)+'</span>' : '<span class="hint">Pend.</span>')+'</td></tr>'; }).join("")+'</tbody></table>';
}

    try{
      if(o){

        if(o.reabierta){ ev.target.disabled = false; motivo = await pedirMotivoModificacion(o); if(!motivo) return; ev.target.disabled = true; }

        if(obj.aprobacion || obj.aprobo){ delete obj.aprobacion; delete obj.aprobo; obj._quitarPorEdicion = true; obj.log.push({fecha:ahora(),por:quien(),accion:"Se quitó la aprobación porque la OC se modificó: hay que volver a aprobarla"}); }

        ir("ordenes", {tipo:"oc", id: obj.id});

function recibidoPorDeposito(o){
  const out = {};
  (o.recepciones||[]).forEach(r => {
    if(r.dist) Object.entries(r.dist).forEach(([lid, deps]) => Object.entries(deps).forEach(([dep, v]) => { (out[lid] = out[lid] || {})[dep] = (out[lid][dep]||0) + Number(v||0); }));
    else Object.entries(r.cantidades||{}).forEach(([lid, v]) => { (out[lid] = out[lid] || {})[o.depositoId] = (out[lid][o.depositoId]||0) + Number(v||0); });
  });
  return out;
}

function modalCerrar(o){

    m.querySelector("#cDoc").innerHTML = l.length ? l.map(d => '<option value="'+esc(d.id)+'">'+(t==="factura"?"Factura":"Remito")+' N° '+esc(d.numero)+' · '+fFecha(d.fecha)+'</option>').join("") : '<option value="">No hay '+(t==="factura"?"facturas cargadas":"remitos cargados")+'</option>'; };
  m.querySelectorAll("input[name=ct]").forEach(r => r.onchange = llenar);

let roGastos = null;
function dibujarBarras(cont, etiquetas, series, acum){
  const svgNS = "http://www.w3.org/2000/svg";
  const draw = () => {
    const W = cont.clientWidth, H = cont.clientHeight; if(!W) return;
    const angosto = W < 520, pl = angosto ? 44 : 70, pr = angosto ? 40 : 62, pt = 14, pb = 26;
    const n = etiquetas.length, tot = etiquetas.map((_,i) => series.reduce((a,s) => a + s.values[i], 0));
    const maxB = Math.max(1, ...tot), maxA = Math.max(1, ...acum.filter(v => v != null));
    const cw = (W - pl - pr) / n, bw = Math.min(46, cw * 0.62), y = v => pt + (H-pt-pb) * (1 - v/maxB), ya = v => pt + (H-pt-pb) * (1 - v/maxA);
    const fmtK = v => v >= 1e6 ? (v/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+" M" : v >= 1e3 ? Math.round(v/1e3).toLocaleString("es-AR")+" k" : Math.round(v).toLocaleString("es-AR");
    let h = '';
    for(let k=0;k<=4;k++){ const v = maxB*k/4, yy = y(v); h += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".12"/>';
      h += '<text x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".6">'+fmtK(v)+'</text>';
      h += '<text x="'+(W-pr+6)+'" y="'+(ya(maxA*k/4)+4)+'" font-size="11" fill="currentColor" fill-opacity=".6">'+fmtK(maxA*k/4)+'</text>'; }
    etiquetas.forEach((e,i) => { const x0 = pl + cw*i + (cw-bw)/2; let base = 0;
      series.forEach(s => { const v = s.values[i]; if(v > 0){ const y1 = y(base+v), y0 = y(base); h += '<rect x="'+x0+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0.5, y0-y1)+'" fill="'+s.color+'"><title>'+esc(s.name)+' · '+esc(e)+': '+esc(money(v, gMon))+'</title></rect>'; base += v; } });

function enUso(tipo, id){
  const campo = { proveedores:"proveedorId", centros:"centroId", depositos:"depositoId", compradores:"compradorId", aprobadores:"aprobadorId", formasPago:"formaPagoId" }[tipo];
  if(tipo === "articulos") return S.oc.some(o => (o.items||[]).some(i => i.articuloId === id)) || S.sol.some(s => (s.items||[]).some(i => i.articuloId === id));
  if(tipo === "centros" && (S.m.depositos.some(d => d.centroId === id) || S.oc.some(o => (o.items||[]).some(i => i.centroId === id)))) return true;
  if(tipo === "depositos" && S.oc.some(o => (o.items||[]).some(i => (i.dist||[]).some(d => d.depositoId === id)))) return true;
  return campo ? (S.oc.some(o => o[campo] === id) || S.sol.some(s => s[campo] === id)) : false;
}

    catch(e){ ev.target.disabled = false; ev.target.textContent = "Importar"; toast("No se pudo guardar: "+(e.message||e.code), true); }

function parseCsv(txt){
  const sep = (txt.split("\n")[0].match(/;/g)||[]).length > (txt.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const lines = []; let row = [], cur = "", q = false;
  for(let i=0;i<txt.length;i++){ const c = txt[i];
    if(q){ if(c === '"' && txt[i+1] === '"'){ cur += '"'; i++; } else if(c === '"') q = false; else cur += c; }
    else if(c === '"') q = true; else if(c === sep){ row.push(cur); cur = ""; } else if(c === "\n"){ row.push(cur.replace(/\r$/,"")); lines.push(row); row = []; cur = ""; } else cur += c; }
  if(cur || row.length){ row.push(cur); lines.push(row); }
  const h = lines.shift() || []; return lines.filter(l => l.some(v => v.trim())).map(l => Object.fromEntries(h.map((k,i) => [k.trim(), l[i]||""])));
}
