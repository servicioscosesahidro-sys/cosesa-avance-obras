services:
  - type: web
    name: cosesa-avance-obras
    runtime: docker
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: GITHUB_BACKUP_TOKEN
        sync: false
      - key: GITHUB_BACKUP_REPO
        sync: false
      - key: GITHUB_BACKUP_BRANCH
        value: main
    # Disco persistente: la base de datos y las fotos sobreviven a los reinicios
    # y a cada actualización. El backup en GitHub sigue funcionando como respaldo.
    disk:
      name: cosesa-data
      mountPath: /var/data
      sizeGB: 1
